# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# The CodeRabbit app is installed on this repository, and this file is what keeps it from reviewing: CodeRabbit's
# default is an automatic review on every pull request and push (docs.coderabbit.ai/configuration/auto-review), so
# deleting this file turns reviews on. Pull requests are reviewed by the Codex bot and the orchestrator's audit.
reviews:
  auto_review:
    enabled: false
