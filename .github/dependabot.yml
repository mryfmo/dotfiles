# Version updates for the SHA-pinned actions in .github/workflows. The cooldown is the repository's release-age
# window: mise's minimum_release_age, npm's min-release-age and scripts/lib/github-release.sh all wait 72 hours.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    labels:
      - dependencies
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
