name: Agent assets

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Keep agent, MCP, plugin, and skill metadata from drifting silently.
    - cron: "23 20 * * 0"

# A pull request's newer head cancels its older run. A main push, schedule or
# dispatch run is grouped by its commit, never with a pull request, and is never
# cancelled while it runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('main-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    # Ten seconds on a pull request; the scheduled link and package checks reach the network.
    timeout-minutes: 10

    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      # validate_git_config renders home/dot_config/git/config.tmpl with chezmoi (with and without the
      # signing key), so the release setup.sh bootstraps is installed first, verified the same way.
      - name: Install chezmoi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/github-release.sh
          chezmoi_version="$(github_release_tag twpayne/chezmoi)"
          chezmoi_version="${chezmoi_version#v}"
          artifact="chezmoi_${chezmoi_version}_linux_amd64.tar.gz"
          base_url="https://github.com/twpayne/chezmoi/releases/download/v${chezmoi_version}"
          # 30 s to connect, and a transfer under 1 KB/s for 60 s fails, as the installers' downloads (U99).
          curl -fsSL --connect-timeout 30 --speed-limit 1024 --speed-time 60 "${base_url}/${artifact}" -o "${RUNNER_TEMP}/${artifact}"
          curl -fsSL --connect-timeout 30 --speed-limit 1024 --speed-time 60 "${base_url}/chezmoi_${chezmoi_version}_checksums.txt" \
            | grep "  ${artifact}$" \
            | (cd "${RUNNER_TEMP}" && sha256sum --check --strict)
          if ! github_release_attestation twpayne/chezmoi "v${chezmoi_version}" "${RUNNER_TEMP}/${artifact}"; then
            echo "chezmoi v${chezmoi_version}: the GitHub release attestation did not verify (gh 2.93.0 or newer, authenticated, is required)" >&2
            exit 1
          fi
          tar -xzf "${RUNNER_TEMP}/${artifact}" -C "${RUNNER_TEMP}" chezmoi
          sudo install -m 0755 "${RUNNER_TEMP}/chezmoi" /usr/local/bin/chezmoi
          chezmoi --version | grep -F "v${chezmoi_version}"

      - name: Validate agent assets
        run: uv run --with pyyaml scripts/validate-agent-assets.py

      - name: Parse CodeRabbit config
        run: |
          uv run --with pyyaml python -c '
          import yaml
          for path in (".coderabbit.yaml",):
              data = yaml.safe_load(open(path))
              assert isinstance(data, dict) and data, path
              print("parsed", path)
          '

      - name: Check upstream documentation links
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          urls=(
            "https://developers.openai.com/codex/config-reference"
            "https://developers.openai.com/codex/mcp"
            "https://developers.openai.com/codex/skills"
            "https://developers.openai.com/codex/plugins"
            "https://code.claude.com/docs/en/settings"
            "https://code.claude.com/docs/en/mcp"
            "https://code.claude.com/docs/en/skills"
            "https://code.claude.com/docs/en/plugins"
            "https://docs.astral.sh/ty/"
            "https://agentskills.io/specification"
          )
          for url in "${urls[@]}"; do
            echo "Checking ${url}"
            curl --fail --location --silent --show-error --connect-timeout 30 --speed-limit 1024 --speed-time 60 \
              --head "${url}" > /dev/null
          done

      - name: Check current package metadata
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          npm view @openai/codex version
          npm view @anthropic-ai/claude-code version
          uvx --from ty ty --version
