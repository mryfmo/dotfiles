name: Docs

on:
  workflow_dispatch:
  # docs-check.yml builds the same paths with --strict on every pull request; keep the two lists equal.
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "Makefile"
      - "README.md"
      - "mkdocs.yml"
      - "scripts/**"
      - "install/**"
      - "home/.chezmoiscripts/**"
      - "home/dot_claude/hooks/**"
      - "home/dot_config/alias/**"
      - "home/dot_local/bin/**"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # The deploy takes under a minute; a hung shdoc or mkdocs install cancels it instead of running 6 h.
    timeout-minutes: 15

    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          # The newest mise at least 72 hours old, as hosts get it (minimum_release_age).
          minimum_release_age: 72h
          install: false
          cache: true

      - name: Trust mise config
        run: mise trust --yes

      - name: Install mise tools
        run: mise install

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy docs
        # The checkout keeps no credential: only this step's git pushes, through gh's credential helper,
        # which reads the step's GH_TOKEN when git asks and writes no token to disk.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git --hostname github.com
          make deploy
