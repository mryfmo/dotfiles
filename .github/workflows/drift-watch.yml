name: drift-watch

# Weekly drift watch (regime-cutover U81): scripts/drift-watch.py reads this tree and public upstream metadata (runner
# image announcements, releases, marketplaces) and reports what has aged: retiring runner images still in a matrix,
# pins behind the newest release past the 72h window, plugin pins behind their marketplace, and the retired-term lint.
# `make drift` runs the same script locally. The job keeps one tracking issue titled "Drift watch", opened by
# github-actions[bot]: it opens it on drift, rewrites its body on every run, and closes it when a run finds none. It
# runs only on the schedule and by hand, from the default branch's code, and reads no pull-request input and no
# secret; the token reads the GitHub API and writes that one issue.
on:
  schedule:
    - cron: "23 1 * * 1"
  workflow_dispatch:

concurrency:
  group: drift-watch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Run the drift watch
        id: watch
        env:
          # Raises the API rate limit; the script sends it to api.github.com only.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          status=0
          uv run --no-config --no-project --with 'pyyaml==6.0.3' python -I scripts/drift-watch.py > "${RUNNER_TEMP}/drift.md" || status=$?
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          cat "${RUNNER_TEMP}/drift.md" >> "${GITHUB_STEP_SUMMARY}"
          case "${status}" in
          0 | 3 | 4) ;;
          *) echo "::error::drift-watch.py exited ${status} without a report" && exit 1 ;;
          esac
      - name: Keep the tracking issue current
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STATUS: ${{ steps.watch.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/drift.md"
          printf '\nRun: %s\n' "${RUN_URL}" >> "${report}"
          # Only an issue the bot opened itself: an issue someone else titles "Drift watch" is never rewritten.
          number="$(gh issue list --state open --author 'github-actions[bot]' --limit 100 --json number,title,author \
            --jq 'map(select(.title == "Drift watch" and .author.login == "app/github-actions")) | .[0].number // empty')"
          if [ "${STATUS}" = 0 ]; then
            if [ -n "${number}" ]; then
              gh issue edit "${number}" --body-file "${report}"
              gh issue close "${number}" --comment "No drift found: ${RUN_URL}"
            fi
          elif [ -n "${number}" ]; then
            gh issue edit "${number}" --body-file "${report}"
          else
            gh issue create --title "Drift watch" --body-file "${report}"
          fi
      - name: Fail on an upstream read failure
        if: steps.watch.outputs.status == '4'
        run: |
          echo "::error::an upstream read failed; the tracking issue lists it under Read failures"
          exit 1
