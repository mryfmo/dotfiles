name: MacOS

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/macos.yaml"
      - "setup.sh"
      - "install/common/**"
      - "install/macos/**"
      - "home/.chezmoiscripts/common/**"
      - "home/.chezmoiscripts/macos/**"
      - "tests/install/common/**"
      - "tests/install/macos/**"

  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/macos.yaml"
      - "setup.sh"
      - "install/common/**"
      - "install/macos/**"
      - "home/.chezmoiscripts/common/**"
      - "home/.chezmoiscripts/macos/**"
      - "tests/install/common/**"
      - "tests/install/macos/**"

permissions:
  contents: read

jobs:
  secrets:
    # The build needs the private deploy key and the e-mail address. Without them the build jobs are skipped
    # (shown as skipped, never as a green pass) and this job's summary and notice say why (F050, gate G13).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check the bootstrap secrets
        id: check
        env:
          WORKFLOW_TITLE: MacOS bootstrap
          BOT_ACTOR: ${{ contains(github.actor, '[bot]') }}
          HAS_EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS != '' }}
          HAS_PRIVATE_DOTFILES_KEY: ${{ secrets.PRIVATE_DOTFILES_PRIVATE_DEPLOY_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "${BOT_ACTOR}" != true ] && [ "${HAS_EMAIL_ADDRESS}" = true ] && [ "${HAS_PRIVATE_DOTFILES_KEY}" = true ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "available=false" >> "${GITHUB_OUTPUT}"
          message="${WORKFLOW_TITLE} did not run: the repository secrets EMAIL_ADDRESS and PRIVATE_DOTFILES_PRIVATE_DEPLOY_KEY are not both available to this run (a bot-triggered run gets neither). This run verifies nothing."
          echo "::notice title=${WORKFLOW_TITLE} skipped::${message}"
          printf '### %s skipped\n\n%s\n' "${WORKFLOW_TITLE}" "${message}" >> "${GITHUB_STEP_SUMMARY}"

  build:
    needs: secrets
    if: ${{ needs.secrets.outputs.available == 'true' }}
    # One matrix row per macOS image; one at a time, because every row pushes to
    # the same benchmark repository.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }} # Apple silicon
    # Two full setup.sh runs, the benchmark and the file tests; a hung install cancels the job instead of running 6 h.
    timeout-minutes: 60
    env:
      # DOTFILES_DEBUG: 1
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HAS_BENCHMARK_TOKEN: ${{ secrets.MY_DOTFILES_BENCHMARK != '' }}

    steps:
      - name: Set up SSH agent and add the private deploy key for the private dotfiles repo
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.PRIVATE_DOTFILES_PRIVATE_DEPLOY_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup dotfiles and verify rerun
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # for avoiding rate limit of GitHub API
        run: |
          if [ "${EVENT_NAME}" == "push" ]; then
            BRANCH_NAME="${REF_NAME}"
          elif [ "${EVENT_NAME}" == "pull_request" ]; then
            BRANCH_NAME="${HEAD_REF}"
          else
            echo "${EVENT_NAME} is not supported" >&2
            exit 1
          fi
          export BRANCH_NAME

          printf '%s\n' "${EMAIL_ADDRESS}" | bash ./setup.sh
          #              │
          #              └─ Simulate inputting an email address into the chezmoi's config.

          # Simulate local drift after chezmoi last wrote the target. A rerun must
          # reject the drift and leave the target byte-identical.
          printf '\n# CI local change after chezmoi apply\n' >> "${HOME}/.zprofile"
          before_local_change="$(cksum "${HOME}/.zprofile")"
          if printf '%s\n' "${EMAIL_ADDRESS}" | bash ./setup.sh; then
            echo "setup unexpectedly accepted local drift" >&2
            exit 1
          fi
          after_local_change="$(cksum "${HOME}/.zprofile")"
          [ "${after_local_change}" = "${before_local_change}" ]

      - name: Unset gpg
        run: |
          git config --global commit.gpgsign false

      - name: Run benchmark
        run: |
          brew install gnu-time chezmoi
          $(chezmoi source-path)/../scripts/run_benchmark.sh > result.json

      - name: Dump result.json
        run: cat result.json

      - name: Set flag for auto-push in the benchmark action
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "${EVENT_NAME}" = "push" ] && [ "${REF}" = "refs/heads/main" ]; then
            echo "auto_push=true" >> $GITHUB_ENV
          else
            echo "auto_push=false" >> $GITHUB_ENV
          fi

      - name: Store benchmark result
        if: ${{ env.HAS_BENCHMARK_TOKEN == 'true' }}
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1
        with:
          # Each image keeps its own series, so runner hardware never mixes in one; the historic
          # "MacOS benchmark" series holds macos-14 data and ends with that image's retirement (U64b).
          name: ${{ format('MacOS benchmark ({0})', matrix.os) }}
          tool: customSmallerIsBetter
          output-file-path: result.json
          github-token: ${{ secrets.MY_DOTFILES_BENCHMARK }}
          gh-repository: "github.com/mryfmo/my-dotfiles-benchmarks"
          auto-push: ${{ env.auto_push }}
          comment-on-alert: true
          fail-on-alert: false
          alert-threshold: "150%"
          alert-comment-cc-users: "@mryfmo"
          benchmark-data-dir-path: "."

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          # The newest mise at least 72 hours old, as hosts get it (minimum_release_age).
          minimum_release_age: 72h
          install: true
          cache: true

      - name: Test file existence
        run: |
          brew install bats-core

          export FILES_TEST_CHEZMOI="$(command -v chezmoi)"
          export FILES_TEST_SOURCE="$(chezmoi source-path)"
          export FILES_TEST_CONFIG="${HOME}/.config/chezmoi/chezmoi.yaml"
          cd "${FILES_TEST_SOURCE}/.."
          # run_bats fails a test by name when it outlives BATS_PER_TEST_TIMEOUT (scripts/run_unit_test.sh).
          bash -c 'source ./scripts/run_unit_test.sh && run_bats "$@"' _ --print-output-on-failure \
            tests/files/common.bats \
            tests/files/macos.bats
