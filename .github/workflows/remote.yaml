name: Snippet install

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 5"

# A pull request's newer head cancels its older run. A main push, schedule or
# dispatch run is grouped by its commit, never with a pull request, and is never
# cancelled while it runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('main-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  public-bootstrap:
    # A failing matrix job never cancels its siblings: each required context reports its own conclusion, and
    # scripts/orchestrator/ci-rerun.sh never meets a cancellation that only a sibling caused.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            system: client
          - os: ubuntu-24.04
            system: server
          - os: macos-15
            system: client

    runs-on: ${{ matrix.os }}
    # Over twice the normal maximum of 13.6 min: a stalled apt mirror cancels the job instead of running it for hours.
    timeout-minutes: 30
    env:
      CI: true
      SYSTEM: ${{ matrix.system }}

    steps:
      - name: Configure isolated HOME
        run: |
          mkdir -p "${RUNNER_TEMP}/dotfiles-home"
          printf 'HOME=%s/dotfiles-home\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether the diff needs a bootstrap
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Decided in this job, never in a job it needs: a job skipped because
          # a needed job failed reports Success even as a required check, so a
          # failed decision has to fail this job instead. Only a pull request has
          # a base-to-head range to judge; push, schedule and workflow_dispatch
          # keep bootstrapping main.
          if [ "${EVENT_NAME}" != pull_request ]; then
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # A full fetch: a shallow one cuts the history of a base tip that
          # moved after the checkout, and the diff then has no merge base.
          git fetch --no-tags origin "${BASE_REF}"
          # --no-renames lists both sides of a rename, and -z lists every path raw:
          # even with core.quotePath off, Git quotes a name holding a quote, a
          # backslash or a control character, and "home/... would miss the pattern.
          # An empty diff runs the bootstrap, and so does a path that can change
          # what setup.sh installs or how this job runs it: outside home/, the
          # files setup.sh, its installers and this job read; anywhere, a chezmoi
          # special file (.chezmoi*) or script (run_*); under home/, every path
          # but the render-only subtrees that no installer executes or reads:
          # managed skills, omp seat policies, Claude rules and the levers in
          # dot_local/bin/common/ and dot_local/bin/server/. A file directly in
          # dot_local/bin/ is not one: it renders to ~/.local/bin/<name>, where
          # the installers run mise, omp and the other tools they install.
          # A diff that skips the bootstrap but changes a render-only path still
          # applies home/ in this job (should_apply), so this required context
          # fails when such a change does not render or apply (F052).
          changed="${RUNNER_TEMP}/changed-paths"
          home_paths="${RUNNER_TEMP}/changed-home-paths"
          git diff -z --no-renames --name-only "origin/${BASE_REF}...${HEAD_SHA}" > "${changed}"
          # grep exits 1 when no path matches and 2 when it fails: a failure fails
          # the job instead of reading as "no bootstrap path changed".
          paths_match() {
            local status=0
            grep -zE "$@" || status=$?
            if [ "${status}" -gt 1 ]; then
              echo "grep -zE $* failed with exit ${status}" >&2
              exit 1
            fi
            return "${status}"
          }
          paths_match '^home/' "${changed}" > "${home_paths}" || true
          # BSD grep -z (the macOS rows) anchors ^ and $ at a newline inside a name, so a path holding a control
          # character could read as render-only there: such a path always bootstraps.
          control=false
          while IFS= read -r -d '' path; do
            case "${path}" in *[[:cntrl:]]*) control=true ;; esac
          done < "${changed}"
          if [ ! -s "${changed}" ] || [ "${control}" = true ] ||
            paths_match -q '^(setup\.sh$|vendor/|install/|scripts/lib/|scripts/update-agent-assets\.sh$|scripts/gh-auth\.sh$|scripts/ci/drop-azure-apt-mirror\.py$|tests/install/|\.github/workflows/remote\.yaml$|\.github/workflows/private-bootstrap\.yaml$)|(^|/)(\.chezmoi|run_)' "${changed}" ||
            paths_match -qv '^home/(dot_agents/skills|dot_agents/omp/policies|dot_claude/rules|dot_config/claude/rules|dot_local/bin/common|dot_local/bin/server)/' "${home_paths}"; then
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
          elif [ -s "${home_paths}" ]; then
            echo "should_run=false" >> "${GITHUB_OUTPUT}"
            echo "should_apply=true" >> "${GITHUB_OUTPUT}"
          else
            echo "should_run=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Skip the bootstrap when no bootstrap path changed
        if: ${{ steps.decide.outputs.should_run != 'true' }}
        env:
          SHOULD_APPLY: ${{ steps.decide.outputs.should_apply }}
        run: |
          if [ "${SHOULD_APPLY}" = true ]; then
            message="Only render-only paths under home/ changed: the bootstrap is skipped and home/ is applied into a scratch HOME instead."
          else
            message="No path the bootstrap reads changed and no path under home/ changed: the job reports success without bootstrapping."
          fi
          echo "${message}"
          printf '### public-bootstrap skipped\n\n%s\n' "${message}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Drop the Azure apt mirror from the runner image
        # Before setup.sh's apt installs (actions/runner-images#14823; scripts/ci/drop-azure-apt-mirror.py, run by the system python3).
        if: ${{ steps.decide.outputs.should_run == 'true' && runner.os == 'Linux' }}
        run: /usr/bin/python3 -I -S scripts/ci/drop-azure-apt-mirror.py

      - name: Bootstrap the checked-out public source
        if: ${{ steps.decide.outputs.should_run == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout -b bootstrap-under-test
          mkdir -p "${HOME}/.local/bin" "${HOME}/.ssh"
          printf 'local-bin-sentinel\n' > "${HOME}/.local/bin/sentinel"
          printf 'ssh-sentinel\n' > "${HOME}/.ssh/sentinel"
          printf 'home-sentinel\n' > "${HOME}/unmanaged-sentinel"
          chmod 640 "${HOME}/.local/bin/sentinel"
          chmod 600 "${HOME}/.ssh/sentinel"
          chmod 644 "${HOME}/unmanaged-sentinel"

          checksum() { cksum "$@"; }
          mode() { stat -c '%a' "$@" 2> /dev/null || stat -f '%Lp' "$@"; }
          before_checksum="$(checksum "${HOME}/.local/bin/sentinel" "${HOME}/.ssh/sentinel" "${HOME}/unmanaged-sentinel")"
          before_mode="$(mode "${HOME}/.local/bin/sentinel" "${HOME}/.ssh/sentinel" "${HOME}/unmanaged-sentinel")"

          # Ubuntu 24.04's AppArmor denies an unconfined program a new user namespace (actions/runner-images#10443),
          # which would leave setup.sh's externals cache check unguarded on the two Linux rows; the runner is disposable,
          # so the restriction is lifted for this job. An image without the sysctl says so here, and the check then
          # says it ran unguarded.
          if [ "${RUNNER_OS}" = Linux ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 \
              || echo "kernel.apparmor_restrict_unprivileged_userns could not be lifted; the externals cache check runs unguarded"
          fi

          # setup.sh's output is kept so this row can require the externals cache check's verdict (U111): the line
          # names the chezmoi version and the network-denial guard it ran under, or that it ran unguarded. pipefail
          # keeps a failed setup.sh failing through the tee.
          printf 'ci@example.invalid\n%s\n' "${SYSTEM}" | \
            DOTFILES_REPO_URL="${GITHUB_WORKSPACE}" BRANCH_NAME=bootstrap-under-test \
            bash "${GITHUB_WORKSPACE}/setup.sh" | tee "${RUNNER_TEMP}/setup.log"
          grep -F 'chezmoi externals: chezmoi read the externals from its cache' "${RUNNER_TEMP}/setup.log"

          test "$(git -C "${HOME}/.local/share/chezmoi" rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(checksum "${HOME}/.local/bin/sentinel" "${HOME}/.ssh/sentinel" "${HOME}/unmanaged-sentinel")" = "${before_checksum}"
          test "$(mode "${HOME}/.local/bin/sentinel" "${HOME}/.ssh/sentinel" "${HOME}/unmanaged-sentinel")" = "${before_mode}"
          if [ "${SYSTEM}" = client ]; then
            test -e "${HOME}/.zshrc"
          else
            test -e "${HOME}/.bashrc"
          fi
          printf 'Validated checkout SHA %s\n' "${GITHUB_SHA}"

      # The render-only paths the bootstrap skips are applied here, in this required context (F052; the separate,
      # non-required chezmoi-apply job of U39 left such a change mergeable while it failed to apply).
      - name: Install chezmoi for the scratch apply
        if: ${{ steps.decide.outputs.should_apply == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # The release setup.sh bootstraps: the newest one at least 72 hours old,
          # resolved by scripts/lib/github-release.sh, checked against the release's
          # checksums and its GitHub attestation before it runs.
          source scripts/lib/github-release.sh
          chezmoi_version="$(github_release_tag twpayne/chezmoi)"
          chezmoi_version="${chezmoi_version#v}"
          case "$(uname -s)/$(uname -m)" in
            Darwin/arm64) chezmoi_platform=darwin_arm64 ;;
            Darwin/x86_64) chezmoi_platform=darwin_amd64 ;;
            Linux/x86_64) chezmoi_platform=linux_amd64 ;;
            *) echo "no chezmoi release for $(uname -s)/$(uname -m)" >&2; exit 1 ;;
          esac
          artifact="chezmoi_${chezmoi_version}_${chezmoi_platform}.tar.gz"
          base_url="https://github.com/twpayne/chezmoi/releases/download/v${chezmoi_version}"
          # By capability, not presence: macOS 15 ships a BSD sha256sum that has no --strict (U64).
          sha256_check=(shasum -a 256 --check --strict)
          [[ "$(sha256sum --version 2> /dev/null)" == *"GNU coreutils"* ]] && sha256_check=(sha256sum --check --strict)
          # 30 s to connect, and a transfer under 1 KB/s for 60 s fails, as the installers' downloads (U99).
          curl -fsSL --connect-timeout 30 --speed-limit 1024 --speed-time 60 "${base_url}/${artifact}" -o "${RUNNER_TEMP}/${artifact}"
          curl -fsSL --connect-timeout 30 --speed-limit 1024 --speed-time 60 "${base_url}/chezmoi_${chezmoi_version}_checksums.txt" \
            | grep "  ${artifact}$" \
            | (cd "${RUNNER_TEMP}" && "${sha256_check[@]}")
          if ! github_release_attestation twpayne/chezmoi "v${chezmoi_version}" "${RUNNER_TEMP}/${artifact}"; then
            echo "chezmoi v${chezmoi_version}: the GitHub release attestation did not verify (gh 2.93.0 or newer, authenticated, is required)" >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/chezmoi-bin"
          tar -xzf "${RUNNER_TEMP}/${artifact}" -C "${RUNNER_TEMP}/chezmoi-bin" chezmoi
          "${RUNNER_TEMP}/chezmoi-bin/chezmoi" --version | grep -F "v${chezmoi_version}"
          printf 'APPLY_CHEZMOI=%s\n' "${RUNNER_TEMP}/chezmoi-bin/chezmoi" >> "${GITHUB_ENV}"

      - name: Apply home/ into a scratch HOME
        if: ${{ steps.decide.outputs.should_apply == 'true' }}
        shell: bash
        # scripts/apply-check.sh is the one implementation of this scratch apply, shared with make apply-check (U82):
        # a copy of the tree under RUNNER_TEMP applied into a scratch HOME there, so the job's HOME and the checkout
        # stay untouched; externals, run_ scripts and encrypted_* targets left out (CI holds no key); init, apply,
        # verify, the unmanaged-file and shell-rc checks, then chezmoi doctor --no-network and check-agent-runtime.py.
        # It prints one summary line and fails when any step fails.
        run: |
          scripts/apply-check.sh --system "${SYSTEM}" --chezmoi "${APPLY_CHEZMOI}"
