name: Unit test

on:
  # Required checks must always report a final status for PRs into `main`.
  # Do not add workflow-level path or branch filters here: GitHub can leave
  # skipped required checks in a pending state and block merges.
  # Keep this workflow unconditional and decide inside jobs whether the full
  # test matrix is necessary for the current diff.
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A pull request's newer head cancels its older run. A main push, schedule or
# dispatch run is grouped by its commit, never with a pull request, and is never
# cancelled while it runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('main-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    # Run the same test suite on each target OS/system pair.
    # We intentionally keep macOS as `client` only because this repository
    # does not define a macOS `server` test target.
    # A failing matrix job never cancels its siblings: each required context reports its own conclusion, and
    # scripts/orchestrator/ci-rerun.sh never meets a cancellation that only a sibling caused.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        system: [client, server]
        exclude:
          - os: macos-15
            system: server
        # Non-required canary for the next Ubuntu image: it shows how the suite
        # fares there without blocking merges. Adopt it by changing the
        # explicit label above once it is green.
        include:
          - os: ubuntu-26.04
            system: client

    runs-on: ${{ matrix.os }}
    # Up to 409 s before `Run unit test` and 10 s after it in passing Ubuntu client jobs (October 2026), around the
    # step's 35 minutes (tests/unit/test_apt_mirror.py BoundOrderTest checks the sum).
    timeout-minutes: 45
    continue-on-error: ${{ matrix.os == 'ubuntu-26.04' }}
    env:
      # Export matrix values to shell scripts so existing test helpers can use
      # simple `OS`/`SYSTEM` checks without depending on GitHub expression syntax.
      OS: ${{ matrix.os }}
      SYSTEM: ${{ matrix.system }}
      # Keep Codecov naming deterministic per job. This makes it easy to trace
      # upload sessions in Codecov API/UI and avoids accidental session overlap.
      CODECOV_FLAGS: ${{ matrix.os }}-${{ matrix.system }}
      CODECOV_NAME: codecov-dotfiles-${{ matrix.os }}-${{ matrix.system }}

    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether the diff needs the unit tests
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Decided in this job, never in a job it needs: a job skipped because
          # a needed job failed reports Success even as a required check, so a
          # failed decision has to fail this job instead.
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            # A full fetch: a shallow one cuts the history of a base tip that
            # moved after the checkout, and the diff then has no merge base.
            git fetch --no-tags origin "${BASE_REF}"
            diff_range="origin/${BASE_REF}...${HEAD_SHA}"
          elif [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            diff_range="${BEFORE_SHA}...${HEAD_SHA}"
          else
            diff_range="${HEAD_SHA}^...${HEAD_SHA}"
          fi

          echo "diff_range=${diff_range}" >> "${GITHUB_OUTPUT}"

          # One decision for every matrix row. A diff skips the unit tests only when it lists at least one path
          # and every path is on the allowlist of paths no test, lint or formatting check reads (F051): the records
          # under .orchestration/ and the .ua/ index (T128 INV-2), a README image directly in .github/, and LICENSE.
          # Root configuration files are not on it: .shellcheckrc, renovate.json, mise.toml and the rest are read by
          # make shellcheck or by the tests. Neither is docs/: the formatting check reads its Markdown and tests read
          # its pages. An empty diff runs the tests on every row: nothing proves it safe to skip.
          # Each path is matched whole with case, never by grep over the NUL-separated list: BSD grep -z (macOS)
          # anchors ^ and $ at a newline inside a name, so home/a<newline>LICENSE would read as LICENSE. A path
          # holding a control character is never on a list.
          skippable() {
            case "$1" in
              *[[:cntrl:]]*) return 1 ;;
              .orchestration/* | .ua/* | LICENSE) return 0 ;;
              .github/*/*) return 1 ;;
              .github/*.png) return 0 ;;
              *) return 1 ;;
            esac
          }
          # macOS adds nothing to a pull request whose every other path is documentation or a formatting config: a
          # Python, shell, install, home, bats, Makefile or workflow change keeps it (F154), and a push to main runs
          # the full matrix.
          os_independent() {
            case "$1" in
              *[[:cntrl:]]*) return 1 ;;
              docs/* | plans/* | ruff.toml | .prettierignore) return 0 ;;
              */*) return 1 ;;
              *.md) return 0 ;;
              *) return 1 ;;
            esac
          }
          # --no-renames lists both sides of a rename, so a file moved out of home/ into .orchestration/ still runs
          # the tests, and -z lists every path raw: Git quotes a name holding a quote, a backslash or a control
          # character even with core.quotePath off. A failed diff fails this job (set -e) instead of reading as
          # "no path changed".
          changed="${RUNNER_TEMP}/changed-paths"
          git diff -z --no-renames --name-only "${diff_range}" > "${changed}"
          paths=0
          all_skippable=true
          all_os_independent=true
          while IFS= read -r -d '' path; do
            paths=$((paths + 1))
            skippable "${path}" && continue
            all_skippable=false
            os_independent "${path}" || all_os_independent=false
          done < "${changed}"
          if [ "${paths}" -eq 0 ]; then
            echo "should_test=true" >> "${GITHUB_OUTPUT}"
          elif [ "${all_skippable}" = true ]; then
            echo "should_test=false" >> "${GITHUB_OUTPUT}"
            echo "skip_reason=only records, the index, images or LICENSE changed" >> "${GITHUB_OUTPUT}"
          elif [[ "${OS:-}" == macos-* ]] && [ "${EVENT_NAME}" = pull_request ] && [ "${all_os_independent}" = true ]; then
            echo "should_test=false" >> "${GITHUB_OUTPUT}"
            echo "skip_reason=os-independent on ${OS}" >> "${GITHUB_OUTPUT}"
          else
            echo "should_test=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Skip full unit test run for unrelated changes
        if: ${{ steps.decide.outputs.should_test != 'true' }}
        env:
          SKIP_REASON: ${{ steps.decide.outputs.skip_reason }}
          DIFF_RANGE: ${{ steps.decide.outputs.diff_range }}
        run: |
          echo "Skipped the unit tests: ${SKIP_REASON}."
          echo "Compared diff range: ${DIFF_RANGE}"
          printf '### Unit tests skipped\n\n%s (diff range %s).\n' "${SKIP_REASON}" "${DIFF_RANGE}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Drop the Azure apt mirror from the runner image
        # Before the first apt use: the tool installs below and the install tests' real apt installs
        # (actions/runner-images#14823; scripts/ci/drop-azure-apt-mirror.py, run by the system python3).
        if: ${{ steps.decide.outputs.should_test == 'true' && runner.os == 'Linux' }}
        run: /usr/bin/python3 -I -S scripts/ci/drop-azure-apt-mirror.py

      - name: Install tools
        if: ${{ steps.decide.outputs.should_test == 'true' }}
        # gh and scripts/lib/github-release.sh authenticate with this token; no other step needs it.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ "${OS}" == macos-* ]]; then
            # The macOS runner images ship third-party taps tapped but
            # untrusted, and Homebrew warns on every `brew install` while one
            # is present. The installs below come from homebrew/core, so
            # resolve those taps with the brew installer's own CI handling
            # rather than a second hard-coded copy of the tap list.
            bash -c 'source install/macos/common/brew.sh; handle_ci_untrusted_taps'

            # `bashcov` on macOS must use Homebrew Bash (>=5) to avoid the
            # system Bash 3.2 parser limitations that produced empty coverage.
            # `gawk` is available for shell tooling used by the test suite.
            brew install bash bats-core gawk parallel

          elif [[ "${OS}" == ubuntu-* ]]; then
            # Ruby is required for bashcov/simplecov formatters.
            sudo apt-get update && sudo apt-get install -y bats curl iproute2 parallel ruby

          else
            echo "${OS} and ${SYSTEM} are not supported" >&2
            exit 1
          fi

          # `chezmoi` is installed so Bats can render chezmoi templates
          # behaviorally instead of grepping template syntax. Both platforms
          # take the release setup.sh bootstraps: the newest one at least 72
          # hours old, resolved by scripts/lib/github-release.sh.
          source scripts/lib/github-release.sh
          chezmoi_version="$(github_release_tag twpayne/chezmoi)"
          chezmoi_version="${chezmoi_version#v}"
          case "$(uname -s)/$(uname -m)" in
            Darwin/arm64) chezmoi_platform=darwin_arm64 ;;
            Darwin/x86_64) chezmoi_platform=darwin_amd64 ;;
            Linux/x86_64) chezmoi_platform=linux_amd64 ;;
            *) echo "no chezmoi release for $(uname -s)/$(uname -m)" >&2; exit 1 ;;
          esac
          artifact="chezmoi_${chezmoi_version}_${chezmoi_platform}.tar.gz"
          base_url="https://github.com/twpayne/chezmoi/releases/download/v${chezmoi_version}"
          # By capability, not presence: macOS 15 ships a BSD sha256sum that has no --strict (U64).
          sha256_check=(shasum -a 256 --check --strict)
          [[ "$(sha256sum --version 2> /dev/null)" == *"GNU coreutils"* ]] && sha256_check=(sha256sum --check --strict)
          # 30 s to connect, and a transfer under 1 KB/s for 60 s fails, as the installers' downloads (U99).
          curl -fsSL --connect-timeout 30 --speed-limit 1024 --speed-time 60 "${base_url}/${artifact}" -o "${RUNNER_TEMP}/${artifact}"
          curl -fsSL --connect-timeout 30 --speed-limit 1024 --speed-time 60 "${base_url}/chezmoi_${chezmoi_version}_checksums.txt" \
            | grep "  ${artifact}$" \
            | (cd "${RUNNER_TEMP}" && "${sha256_check[@]}")
          # The checksum file comes from the same release; the attestation is the publisher's
          # check, verified before chezmoi runs with the runner's authenticated gh (GITHUB_TOKEN).
          if ! github_release_attestation twpayne/chezmoi "v${chezmoi_version}" "${RUNNER_TEMP}/${artifact}"; then
            echo "chezmoi v${chezmoi_version}: the GitHub release attestation did not verify (gh 2.93.0 or newer, authenticated, is required)" >&2
            exit 1
          fi
          tar -xzf "${RUNNER_TEMP}/${artifact}" -C "${RUNNER_TEMP}" chezmoi
          sudo install -m 0755 "${RUNNER_TEMP}/chezmoi" /usr/local/bin/chezmoi

          files_test_chezmoi="$(command -v chezmoi)"
          case "${files_test_chezmoi}" in
            /*/mise/shims/*|"")
              echo "Files test chezmoi must resolve outside mise shims: ${files_test_chezmoi:-missing}" >&2
              exit 1
              ;;
            /*) ;;
            *)
              echo "Files test chezmoi must be an absolute path: ${files_test_chezmoi}" >&2
              exit 1
              ;;
          esac
          test -x "${files_test_chezmoi}"
          # A runner-provided chezmoi earlier on PATH must not shadow this release.
          "${files_test_chezmoi}" --version | grep -F "v${chezmoi_version}"
          printf 'FILES_TEST_CHEZMOI=%s\n' "${files_test_chezmoi}" >> "${GITHUB_ENV}"

          # Install coverage tooling as user gems and expose gem bin dir on PATH
          # before installation so RubyGems can expose executables immediately.
          # `--no-document` keeps CI faster and deterministic.
          gem_bin_dir="$(ruby -r rubygems -e 'puts Gem.user_dir')/bin"
          echo "${gem_bin_dir}" >> "${GITHUB_PATH}"
          export PATH="${gem_bin_dir}:${PATH}"
          gem install --user-install --no-document bashcov --version 3.3.0
          gem install --user-install --no-document simplecov-cobertura --version 3.1.0

      - name: Prepare statusline tool config
        if: ${{ steps.decide.outputs.should_test == 'true' }}
        run: |
          statusline_mise_dir="${RUNNER_TEMP}/statusline-mise"
          mkdir -p "${statusline_mise_dir}"
          cp home/dot_mise/config.toml "${statusline_mise_dir}/mise.toml"

      - name: Setup mise for statusline smoke
        if: ${{ steps.decide.outputs.should_test == 'true' }}
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          # The newest mise at least 72 hours old, as hosts get it (minimum_release_age).
          minimum_release_age: 72h
          install: false
          cache: true

      - name: Install statusline tools
        if: ${{ steps.decide.outputs.should_test == 'true' }}
        run: |
          mise trust --yes "${RUNNER_TEMP}/statusline-mise/mise.toml"
          mise -C "${RUNNER_TEMP}/statusline-mise" install node
          # Every version comes from the copied config and its minimum_release_age (no literal here).
          mise -C "${RUNNER_TEMP}/statusline-mise" install npm:ccstatusline npm:ccusage
          mise -C "${RUNNER_TEMP}/statusline-mise" install http:ruff npm:prettier

      - name: Install Claude Code for the Linux doctor check
        if: ${{ steps.decide.outputs.should_test == 'true' && matrix.os == 'ubuntu-24.04' }}
        run: |
          set -euo pipefail
          # The version mise resolves from the copied config and its minimum_release_age, as hosts get it (no
          # literal here). tests/unit/test_generate_agent_configs.py ClaudeDoctorLinuxGlobTest runs `claude doctor`
          # on the rendered settings and fails when CLAUDE_DOCTOR_BIN is set but not executable (regime-cutover U17).
          mise -C "${RUNNER_TEMP}/statusline-mise" install npm:@anthropic-ai/claude-code
          claude_bin="$(mise -C "${RUNNER_TEMP}/statusline-mise" which claude)"
          "${claude_bin}" --version
          printf 'CLAUDE_DOCTOR_BIN=%s\n' "${claude_bin}" >> "${GITHUB_ENV}"

      - name: Run the omp TypeScript tests
        if: ${{ steps.decide.outputs.should_test == 'true' && matrix.os == 'ubuntu-24.04' && matrix.system == 'client' }}
        run: |
          set -euo pipefail
          # The stop gate and the openai-siwc extension are TypeScript that omp loads; until this step their bun
          # tests ran only on worker seats (U39 addendum 2). bun is the version mise resolves from the copied config
          # and its minimum_release_age, as hosts get it (no literal here). One run per directory: bun exits 1 when
          # a filter matches no test file, so a moved or emptied directory fails the step instead of passing it.
          mise -C "${RUNNER_TEMP}/statusline-mise" install bun
          bun_bin="$(mise -C "${RUNNER_TEMP}/statusline-mise" which bun)"
          "${bun_bin}" --version
          # openai-siwc's tests/requests.test.ts drives omp's own Responses transport from the installed omp package
          # (OMP_PACKAGE_DIR). update_omp installs it as hosts get it: the pinned tarball, its sha256 checked, then
          # npm, here into a scratch HOME. It skips without npm, so the package file is checked afterwards. It then
          # runs `omp --version`, and omp's entry point is `#!/usr/bin/env bun`, so bun is on its PATH as on a host.
          # Its download directory comes from mktemp under TMPDIR, else /tmp, so TMPDIR is a scratch directory too:
          # the install writes under RUNNER_TEMP only (npm's cache and mise's reshim follow the scratch HOME).
          omp_home="${RUNNER_TEMP}/omp-home"
          omp_tmp="${RUNNER_TEMP}/omp-tmp"
          mkdir -p "${omp_home}" "${omp_tmp}"
          node_bin_dir="$(mise -C "${RUNNER_TEMP}/statusline-mise" where node)/bin"
          bun_bin_dir="$(dirname "${bun_bin}")"
          HOME="${omp_home}" TMPDIR="${omp_tmp}" PATH="${node_bin_dir}:${bun_bin_dir}:${PATH}" \
            bash -c 'source ./scripts/update-agent-assets.sh && update_omp'
          export OMP_PACKAGE_DIR="${omp_home}/.local/lib/node_modules/@oh-my-pi/pi-coding-agent"
          test -f "${OMP_PACKAGE_DIR}/package.json"
          # The suites and whatever they spawn run on this one bun: a test that starts a bare `bun` would otherwise
          # resolve mise's bun shim, which this job's global config does not resolve ("bun is not a valid shim",
          # exit 1; ADDENDUM 3). The Python tests that run stop-gate.ts under bun where bun is found
          # (test_hcom_seat.py, U33c) get the real binary first on PATH too, so in this cell they run that half.
          for tests in home/dot_agents/omp/hooks/tests home/dot_agents/omp/extensions/openai-siwc/tests; do
            PATH="${bun_bin_dir}:${PATH}" "${bun_bin}" test "./${tests}"
          done
          printf '%s\n' "${bun_bin_dir}" >> "${GITHUB_PATH}"

      - name: Smoke-test statusline tools without network
        if: ${{ steps.decide.outputs.should_test == 'true' }}
        run: |
          set -euo pipefail

          statusline_mise_dir="${RUNNER_TEMP}/statusline-mise"
          ccstatusline_bin="$(mise -C "${statusline_mise_dir}" which ccstatusline)"
          ccusage_bin="$(mise -C "${statusline_mise_dir}" which ccusage)"
          # mise which answers through the "latest" symlink and mise where with the
          # version directory, so both sides are compared as physical paths.
          ccstatusline_root="$(cd "$(mise -C "${statusline_mise_dir}" where npm:ccstatusline)" && pwd -P)"
          ccusage_root="$(cd "$(mise -C "${statusline_mise_dir}" where npm:ccusage)" && pwd -P)"
          ccstatusline_version="$(mise -C "${statusline_mise_dir}" current npm:ccstatusline)"
          ccusage_version="$(mise -C "${statusline_mise_dir}" current npm:ccusage)"
          # Run both tools on the node the copied config resolved. Without this, their
          # `#!/usr/bin/env node` falls through the mise shim to the image's
          # system node, which nothing has read yet: on the ubuntu-26.04 image
          # that cold first read of /usr/local/bin/node alone took 0.6 s to over
          # 5 s (fincore: 0 resident pages before the run), which tripped the
          # 5-second limit (T59).
          node_bin_dir="$(mise -C "${statusline_mise_dir}" where node)/bin"
          case "$(PATH="${node_bin_dir}:${PATH}" command -v node)" in
            "${node_bin_dir}/node") ;;
            *) echo "node did not resolve from mise's install" >&2; exit 1 ;;
          esac

          case "$(cd "$(dirname "${ccstatusline_bin}")" && pwd -P)/" in
            "${ccstatusline_root}"/*) ;;
            *) echo "ccstatusline did not resolve from mise's install" >&2; exit 1 ;;
          esac
          case "$(cd "$(dirname "${ccusage_bin}")" && pwd -P)/" in
            "${ccusage_root}"/*) ;;
            *) echo "ccusage did not resolve from mise's install" >&2; exit 1 ;;
          esac

          smoke_home="${RUNNER_TEMP}/statusline-smoke-home"
          mkdir -p "${smoke_home}"
          smoke=(
            /usr/bin/env
            "HOME=${smoke_home}"
            "PATH=${node_bin_dir}:${PATH}"
            "HTTP_PROXY=http://127.0.0.1:1"
            "HTTPS_PROXY=http://127.0.0.1:1"
            NO_PROXY=
            python3 scripts/check-statusline-tools.py
            --ccstatusline "${ccstatusline_bin}"
            --ccstatusline-version "${ccstatusline_version}"
            --ccusage "${ccusage_bin}"
            --ccusage-version "${ccusage_version}"
          )
          smoke_failed() {
            printf 'statusline smoke failed with npm:ccusage %s and npm:ccstatusline %s: bump the exact pins in home/dot_mise/config.toml\n' \
              "${ccusage_version}" "${ccstatusline_version}" >&2
            exit 1
          }

          if [[ "${OS}" == ubuntu-* ]]; then
            sudo unshare --net -- sh -c 'test -z "$(ip route show)"'
            sudo unshare --net -- "${smoke[@]}" || smoke_failed
          elif [[ "${OS}" == macos-* ]]; then
            sandbox_profile='(version 1)(allow default)(deny network*)'
            if /usr/bin/sandbox-exec -p "${sandbox_profile}" \
              python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0))'; then
              echo "macOS network-denial oracle unexpectedly bound a socket" >&2
              exit 1
            fi
            /usr/bin/sandbox-exec -p "${sandbox_profile}" "${smoke[@]}" || smoke_failed
          else
            echo "${OS} is not supported" >&2
            exit 1
          fi

      - name: Put the pinned `ShellCheck` and `shfmt` on PATH
        if: ${{ steps.decide.outputs.should_test == 'true' }}
        # Each version and each platform's sha256 come from home/dot_mise/config.toml ([tools."http:shellcheck"] and
        # [tools."http:shfmt"], copied by "Prepare statusline tool config"); mise checks each download against that
        # sha256. Neither apt nor brew installs either tool, and the lint steps refuse any other version (U97).
        # make shellcheck, scripts/ci/masked-dirname-check.sh and the unit tests get the same two from PATH.
        # scripts/ci/install-pinned-lint-tools.sh checks each install and lookup before it touches GITHUB_PATH.
        run: scripts/ci/install-pinned-lint-tools.sh "${RUNNER_TEMP}/statusline-mise" shellcheck shfmt

      - name: Run `shfmt`
        if: ${{ steps.decide.outputs.should_test == 'true' }}
        run: |
          # The pinned shfmt from the step above; brew and apt ship other versions, and 3.14 changed heredoc-in-if
          # formatting, so the guard refuses any other.
          scripts/ci/pinned-tool-version.sh home/dot_mise/config.toml shfmt
          # Every tracked bash or sh script (by extension or shebang, less the exclusions the script names), the set
          # make format checks too.
          scripts/ci/run-on-lint-files.sh shell shfmt -i 4 -sr -d

      - name: Check Python and Markdown formatting
        if: ${{ steps.decide.outputs.should_test == 'true' }}
        run: |
          # ruff and prettier are the versions home/dot_mise/config.toml pins ([tools."http:ruff"] and
          # "npm:prettier", U97), and each check refuses any other first. mise -C resolves them from the copied
          # config and changes directory, so each check returns to the repository, where ruff.toml and
          # .prettierignore apply. --config makes the root ruff.toml govern every file, so its
          # exclusions also cover vendor/compactiondb, which has its own pyproject.
          mise -C "${RUNNER_TEMP}/statusline-mise" x http:ruff -- \
            sh -c 'cd "${GITHUB_WORKSPACE}" && scripts/ci/pinned-tool-version.sh home/dot_mise/config.toml ruff && scripts/ci/run-on-lint-files.sh python ruff format --config ruff.toml --check'
          mise -C "${RUNNER_TEMP}/statusline-mise" x node npm:prettier -- \
            sh -c 'cd "${GITHUB_WORKSPACE}" && scripts/ci/pinned-tool-version.sh home/dot_mise/config.toml prettier && scripts/ci/run-on-lint-files.sh markdown prettier --check'

      - name: Run `ShellCheck`
        if: ${{ steps.decide.outputs.should_test == 'true' }}
        # The Makefile's shellcheck target names the two groups (regime-cutover U38, U38b): setup.sh,
        # install/**, scripts/*.sh and scripts/lib/*, and the bash scripts of scripts/orchestrator/* and
        # home/dot_local/bin/common/executable_*, both with .shellcheckrc (check-extra-masked-returns) plus
        # scripts/ci/masked-dirname-check.sh. tests/unit/test_shellcheck_target.py pins this step to that target.
        run: make shellcheck

      - name: Setup uv
        if: ${{ steps.decide.outputs.should_test == 'true' }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Run Python unit tests
        if: ${{ steps.decide.outputs.should_test == 'true' }}
        run: |
          if [[ "${OS}" == ubuntu-* ]]; then
            sudo apt-get update && sudo apt-get install -y jq zsh
          elif [[ "${OS}" == macos-* ]]; then
            command -v jq > /dev/null 2>&1 || brew install jq
            command -v zsh > /dev/null 2>&1 || brew install zsh
          fi

          # The modules run in parallel shards with one combined summary that fails when any shard fails
          # (scripts/ci/unittest-shards.py; UNIT_TEST_JOBS=1 is the serial run). Twice as many shards as CPUs:
          # the tests wait on their subprocesses, and on PR #493 that took the step from 215 s to 170 s on
          # macos-14 (3 CPUs, the macOS image of that time) and from 111 s to 92 s on ubuntu-24.04 (4 CPUs) (U39).
          cpus="$(getconf _NPROCESSORS_ONLN)"
          UNIT_TEST_JOBS="$(( 2 * cpus ))" make unit-test

      - name: Prepare public dotfiles fixture
        if: ${{ steps.decide.outputs.should_test == 'true' }}
        run: |
          set -euo pipefail

          files_test_home="${RUNNER_TEMP}/dotfiles-files-${OS}-${SYSTEM}"
          files_test_source="${RUNNER_TEMP}/dotfiles-public-source-${OS}-${SYSTEM}"
          files_test_config="${files_test_home}/.config/chezmoi/chezmoi.yaml"
          if [ -e "${files_test_source}" ]; then
            echo "Fixture source already exists: ${files_test_source}" >&2
            exit 1
          fi
          cp -R "${GITHUB_WORKSPACE}/home" "${files_test_source}"
          rm -f "${files_test_source}/.chezmoiexternal.yaml.tmpl"
          rm -rf "${files_test_source}/.chezmoitemplates/chezmoiexternal.d"
          mkdir -p "${files_test_home}" "$(dirname "${files_test_config}")"
          printf 'sourceDir: "%s"\ndata:\n  email: "ci@example.invalid"\n  system: "%s"\n' \
            "${files_test_source}" "${SYSTEM}" > "${files_test_config}"

          # Remove external definitions only from the fixture copy, then apply
          # everything else so role-specific ignores determine both boundaries.
          # Regenerate the full config from its managed template first so
          # subsequent `chezmoi diff` output contains only target drift.
          CI=true HOME="${files_test_home}" "${FILES_TEST_CHEZMOI}" \
            --source "${files_test_source}" \
            --destination "${files_test_home}" \
            --config "${files_test_config}" \
            init
          HOME="${files_test_home}" "${FILES_TEST_CHEZMOI}" \
            --source "${files_test_source}" \
            --destination "${files_test_home}" \
            --config "${files_test_config}" \
            --refresh-externals=never \
            apply --exclude=scripts,externals
          {
            printf 'FILES_TEST_HOME=%s\n' "${files_test_home}"
            printf 'FILES_TEST_SOURCE=%s\n' "${files_test_source}"
            printf 'FILES_TEST_CONFIG=%s\n' "${files_test_config}"
          } >> "${GITHUB_ENV}"

      - name: Run unit test
        # The hard stop. Passing Ubuntu client runs took 184-210 s here, and 1143-1361 s when a slow Azure apt mirror
        # served misc (1055-1077 s); the Azure mirror is now dropped first. scripts/ci/run-bats.py names a stalled test
        # after its per-test bound (the wrapper's default) and prints its diagnosis; one earlier test as slow as that bound, the stalled
        # test's bound and the other tests (at most 284 s measured) fit under this, so the name prints first (BoundOrderTest).
        timeout-minutes: 35
        if: ${{ steps.decide.outputs.should_test == 'true' }}
        run: |
          if [[ "${OS}" == macos-* ]]; then
            # Bats uses its own tracing internals on macOS, and bashcov can
            # misread those records as coverage trace entries. Keep macOS in
            # the test matrix for platform validation, but collect Codecov
            # reports from the Ubuntu jobs where bashcov parses Bats output
            # reliably.
            ./scripts/run_unit_test.sh
            exit 0
          fi

          # Shared bashcov defaults:
          # - `--skip-uncovered`: limit report to executed files.
          # - `--root .`: normalize paths relative to repository root.
          bashcov_args=(--skip-uncovered --root .)

          # Use a unique command name per matrix job so SimpleCov keeps each
          # session separated before Codecov merges by flag/name.
          BASHCOV_COMMAND_NAME="unit-test-${OS}-${SYSTEM}" \
            ruby ./scripts/run_bashcov_unit_test.rb "${bashcov_args[@]}" -- ./scripts/run_unit_test.sh

      - name: Setup for Codecov
        if: ${{ steps.decide.outputs.should_test == 'true' && matrix.os == 'ubuntu-24.04' && !endsWith(github.actor, '[bot]') }}
        run: |
          # codecov-action uses these tools while preparing and uploading the
          # explicit Cobertura report in this repository setup.
          sudo apt-get install -y jq curl

      - name: Upload coverage to Codecov
        if: ${{ steps.decide.outputs.should_test == 'true' && matrix.os == 'ubuntu-24.04' && !endsWith(github.actor, '[bot]') }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage/coverage.xml
          # Upload only the explicit report file generated in this workflow.
          # This prevents unexpected auto-discovery from old/temporary files.
          disable_search: true
          env_vars: OS,SYSTEM
          fail_ci_if_error: false
          flags: ${{ env.CODECOV_FLAGS }}
          name: ${{ env.CODECOV_NAME }}
          # Avoid language auto-discovery warnings for gcov/coverage.py in this
          # shell-only workflow; upload the explicit Cobertura report only.
          plugins: noop
          # Use the PyPI-distributed CLI in CI to avoid non-actionable GPG trust
          # warnings emitted by the standalone binary signature verifier.
          use_pypi: true
          # The CLI pip installs: codecov-cli 11.3.1 (PyPI, 2026-07-09), not the newest at run time.
          version: 11.3.1
          verbose: false
