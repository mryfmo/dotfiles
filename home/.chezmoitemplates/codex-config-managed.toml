#:schema https://developers.openai.com/codex/config-schema.json
# Codex CLI user configuration managed by chezmoi.
# Generated from home/dot_agents/agent-config.yaml by scripts/generate-agent-configs.py.
# Keep secrets and OAuth state out of this file; use environment variables or
# Codex-managed credential storage for MCP authentication.

model = "gpt-5.6-sol"
model_reasoning_effort = "high"
model_reasoning_summary = "concise"
model_verbosity = "low"
personality = "pragmatic"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"
check_for_update_on_startup = false
project_doc_max_bytes = 65536
project_doc_fallback_filenames = ["CLAUDE.md"]

[tui]
status_line = ["model-with-reasoning", "context-remaining", "used-tokens", "total-input-tokens", "total-output-tokens", "five-hour-limit", "weekly-limit", "git-branch"]

[tui.model_availability_nux]
"gpt-5.6-sol" = 2

[sandbox_workspace_write]
network_access = false
writable_roots = ["{{ .chezmoi.homeDir }}/.agents/skills/agmsg/db", "{{ .chezmoi.homeDir }}/.agents/skills/agmsg/teams", "{{ .chezmoi.homeDir }}/.agents/skills/agmsg/run", "{{ .chezmoi.homeDir }}/.agents/skills/agmsg/ext-tools"]

[shell_environment_policy]
inherit = "core"
set = { PATH = "{{ .chezmoi.homeDir }}/.local/share/mise/installs/node/lts/bin:{{ .chezmoi.homeDir }}/.local/share/mise/shims:{{ .chezmoi.homeDir }}/.local/bin:{{ .chezmoi.homeDir }}/.local/bin/common:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" }

[features]
plugins = true
hooks = true
plugin_hooks = true

[plugins."superpowers@openai-curated"]
enabled = true

[plugins."crit@mryfmo-personal-plugins"]
enabled = true

[plugins."ponytail@ponytail"]
enabled = true

[marketplaces.ponytail]
last_updated = "2026-06-30T01:47:41Z"
last_revision = "16f6cbf4b87792938e47b0f8c650b6d80fcbc98c"
source_type = "git"
source = "https://github.com/DietrichGebert/ponytail.git"

[[hooks.PermissionRequest]]
matcher = "*"

[[hooks.PermissionRequest.hooks]]
type = "command"
command = "{{ .chezmoi.homeDir }}/.local/bin/common/permgate codex"
timeout = 10
statusMessage = "Evaluating permission request"

[[hooks.PreCompact]]
matcher = "*"

[[hooks.PreCompact.hooks]]
type = "command"
command = "{{ .chezmoi.homeDir }}/.local/bin/common/contextdb-codex-notify"
timeout = 10
statusMessage = "Recording to CompactionDB"

[[hooks.PostCompact]]
matcher = "*"

[[hooks.PostCompact.hooks]]
type = "command"
command = "{{ .chezmoi.homeDir }}/.local/bin/common/contextdb-codex-notify"
timeout = 10
statusMessage = "Recording to CompactionDB"

[[hooks.SessionEnd]]
matcher = "*"

[[hooks.SessionEnd.hooks]]
type = "command"
command = "{{ .chezmoi.homeDir }}/.local/bin/common/contextdb-codex-notify"
timeout = 3
statusMessage = "Recording to CompactionDB"

[hooks.state]

[hooks.state."{{ .chezmoi.homeDir }}/.codex/config.toml:permission_request:0:0"]
enabled = true

[hooks.state."{{ .chezmoi.homeDir }}/.codex/config.toml:pre_compact:0:0"]
enabled = true

[hooks.state."{{ .chezmoi.homeDir }}/.codex/config.toml:post_compact:0:0"]
enabled = true

[hooks.state."{{ .chezmoi.homeDir }}/.codex/config.toml:session_end:0:0"]
enabled = true

[hooks.state."crit@mryfmo-personal-plugins:hooks/hooks.json:stop:0:0"]
trusted_hash = "sha256:bf6ad428ae7902810fa2d68d8db42228377af118aa18508ad0eccf73a95ed1f8"
enabled = true

[hooks.state."ponytail@ponytail:hooks/claude-codex-hooks.json:session_start:0:0"]
trusted_hash = "sha256:7ee5d5ae1f4a9e55f1f429f2960c2f9f32293f198c0e8e2e42b2fb3b4eeda142"
enabled = true

[hooks.state."ponytail@ponytail:hooks/claude-codex-hooks.json:user_prompt_submit:0:0"]
trusted_hash = "sha256:8c9efc5a5e649c8cdca3f0b7bf4cba81d9717d1bc930c7dbc18b6efd66c7c58c"
enabled = true

[hooks.state."ponytail@ponytail:hooks/claude-codex-hooks.json:subagent_start:0:0"]
trusted_hash = "sha256:7954d675ef3bafd5e5a6073ae51d7de57a08f21340f241c332f99078e955675d"
enabled = true

[projects."{{ .chezmoi.workingTree }}"]
trust_level = "trusted"
