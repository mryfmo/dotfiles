# Canonical AI-agent configuration managed by chezmoi.
#
# This file is the single source of truth for Codex and Claude Code.
# Agent-native files are generated from this manifest by scripts/generate-agent-configs.py.
#
# Best-practice rules encoded here:
# - Define one shared capability catalog and render native adapters for every agent.
# - Keep shared skills in ~/.agents/skills and expose the same skill set to every agent.
# - Keep MCP servers disabled by default; enable only after checking scope and credentials.
# - Store credentials as environment-variable references or inherited environment only.
# - Use current maintained MCP servers; deprecated packages are rejected by validation.
# - Keep Codex writable roots for shared agmsg state under codex.sandbox_workspace_write.
#   The Claude sandbox allowWrite list is rendered from the same entries.
# - Let upstream install.sh own ~/.agents/skills/agmsg; never vendor it (assets.agmsg).

schema_version: 1

target_agents:
  - codex
  - claude

skills:
  canonical_dir: ~/.agents/skills

# Model IDs and efforts live only in this map. Profiles render into Claude
# settings, per-profile Codex config files (~/.codex/<name>.config.toml), and
# ~/.agents/model-profiles.env for launchers. Keep main-session models fixed
# within a session; switching models mid-session invalidates the prompt cache.
model_profiles:
  express:
    claude: { model: haiku, effort: low }
    codex: { model: gpt-5.6-luna, model_reasoning_effort: low }
  standard:
    claude: { model: claude-opus-5-5, effort: xhigh, advisor: fable }
    codex:
      model: gpt-6.1-sol
      model_reasoning_effort: high
      notify: ['{{ .chezmoi.homeDir }}/.local/bin/common/contextdb-codex-notify']
  review:
    # One capability tier above the worker at full effort (operator decision 2026-10-07).
    claude: { model: claude-fable-5-1, effort: high }
    codex: { model: gpt-5.6-sol, model_reasoning_effort: low }
  deep:
    claude: { model: claude-fable-5-1, effort: high, advisor: fable }
    codex:
      model: gpt-5.6-sol
      model_reasoning_effort: high
      notify: ['{{ .chezmoi.homeDir }}/.local/bin/common/contextdb-codex-notify']
  security:
    # Security-audit tier: specialist model for auditing pending changes.
    claude: { model: claude-fable-5, effort: high }
    codex:
      # gpt-daybreak-blue-latest requires API-key auth (rejected under ChatGPT login).
      model: gpt-6-astra
      model_reasoning_effort: high
      notify: ['{{ .chezmoi.homeDir }}/.local/bin/common/contextdb-codex-notify']
  audit:
    # Auditor tier (監査役): cross-vendor read-only audit of worker changesets
    # at xhigh reasoning effort (operator pin 2026-10-09, T115).
    claude: { model: claude-fable-5-1, effort: high }
    codex:
      model: gpt-6-astra
      model_reasoning_effort: xhigh
      sandbox_mode: read-only
      notify: ['{{ .chezmoi.homeDir }}/.local/bin/common/contextdb-codex-notify']
interactive_profile: deep
# Worker pane agent for herdr-agents: codex or claude. Renders into
# ~/.agents/model-profiles.env as HERDR_AGENTS_WORKER_KIND; an explicit
# HERDR_AGENTS_WORKER_KIND in the environment still overrides it.
worker_kind: claude
# Orchestrator pane agent for the herdr-agents pair: claude or codex; codex
# means the pair is driven by codex-orchestrate (T86). Renders into
# ~/.agents/model-profiles.env as HERDR_AGENTS_ORCHESTRATOR_KIND; an explicit
# HERDR_AGENTS_ORCHESTRATOR_KIND in the environment still overrides it.
orchestrator_kind: claude
# Worker pane model profile for herdr-agents. Renders into
# ~/.agents/model-profiles.env as HERDR_AGENTS_WORKER_PROFILE; an explicit
# HERDR_AGENTS_WORKER_PROFILE in the environment still overrides it.
worker_profile: standard
# Worktree that seats the herdr-agents pair's worker pane, relative to the
# repository root. Renders into ~/.agents/model-profiles.env as
# HERDR_AGENTS_WORKER_WORKTREE; herdr-agents creates it from origin/main when
# missing, registers the worker identity there, and sets delivery on it.
worker_worktree: .claude/worktrees/worker-c

codex:
  config_path: home/.chezmoitemplates/codex-config-managed.toml
  model_reasoning_summary: concise
  model_verbosity: low
  personality: pragmatic
  approval_policy: on-request
  sandbox_mode: workspace-write
  web_search: cached
  check_for_update_on_startup: false
  project_doc_max_bytes: 65536
  project_doc_fallback_filenames:
    - CLAUDE.md
  tui:
    status_line:
      - model-with-reasoning
      - context-remaining
      - used-tokens
      - total-input-tokens
      - total-output-tokens
      - five-hour-limit
      - weekly-limit
      - git-branch
    model_availability_nux:
      gpt-5.6-sol: 2
  sandbox_workspace_write:
    network_access: false
    writable_roots:
      - '{{ .chezmoi.homeDir }}/.agents/skills/agmsg/db'
      - '{{ .chezmoi.homeDir }}/.agents/skills/agmsg/teams'
      - '{{ .chezmoi.homeDir }}/.agents/skills/agmsg/run'
      - '{{ .chezmoi.homeDir }}/.agents/skills/agmsg/ext-tools'
  shell_environment_policy:
    inherit: core
    set:
      PATH: '{{ .chezmoi.homeDir }}/.local/share/mise/installs/node/lts/bin:{{ .chezmoi.homeDir }}/.local/share/mise/shims:{{ .chezmoi.homeDir }}/.local/bin:{{ .chezmoi.homeDir }}/.local/bin/common:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin'
  features:
    plugins: true
    hooks: true
    plugin_hooks: true
  plugins:
    superpowers@openai-curated:
      enabled: true
    crit@mryfmo-personal-plugins:
      enabled: true
    ponytail@ponytail:
      enabled: true
  marketplaces:
    # last_updated/last_revision render from assets.codex-plugins.
    ponytail:
      source_type: git
      source: https://github.com/DietrichGebert/ponytail.git
  hooks:
    permission_request:
      command: '{{ .chezmoi.homeDir }}/.local/bin/common/permgate codex'
      timeout: 10
      status_message: Evaluating permission request
    # Compaction and session end reach CompactionDB like Claude's hooks do; the
    # profiles' notify entries still carry each turn's assistant message.
    command_hooks:
      - event: PreCompact
        command: '{{ .chezmoi.homeDir }}/.local/bin/common/contextdb-codex-notify'
        timeout: 10
        status_message: Recording to CompactionDB
      - event: PostCompact
        command: '{{ .chezmoi.homeDir }}/.local/bin/common/contextdb-codex-notify'
        timeout: 10
        status_message: Recording to CompactionDB
      - event: SessionEnd
        command: '{{ .chezmoi.homeDir }}/.local/bin/common/contextdb-codex-notify'
        timeout: 3
        status_message: Recording to CompactionDB
    # The hooks this repository ships or installs, trusted by `make update`: the modify scripts hash each
    # one at apply time (a config hook from its manifest definition embedded in the modify script, a plugin
    # hook from the installed plugin file). trusted_hash is only the fallback when a plugin file is absent.
    state:
      '{{ .chezmoi.homeDir }}/.codex/config.toml:permission_request:0:0':
        enabled: true
      '{{ .chezmoi.homeDir }}/.codex/config.toml:pre_compact:0:0':
        enabled: true
      '{{ .chezmoi.homeDir }}/.codex/config.toml:post_compact:0:0':
        enabled: true
      '{{ .chezmoi.homeDir }}/.codex/config.toml:session_end:0:0':
        enabled: true
      crit@mryfmo-personal-plugins:hooks/hooks.json:stop:0:0:
        trusted_hash: sha256:bf6ad428ae7902810fa2d68d8db42228377af118aa18508ad0eccf73a95ed1f8
        enabled: true
      ponytail@ponytail:hooks/claude-codex-hooks.json:session_start:0:0:
        trusted_hash: sha256:7ee5d5ae1f4a9e55f1f429f2960c2f9f32293f198c0e8e2e42b2fb3b4eeda142
        enabled: true
      ponytail@ponytail:hooks/claude-codex-hooks.json:user_prompt_submit:0:0:
        trusted_hash: sha256:8c9efc5a5e649c8cdca3f0b7bf4cba81d9717d1bc930c7dbc18b6efd66c7c58c
        enabled: true
      ponytail@ponytail:hooks/claude-codex-hooks.json:subagent_start:0:0:
        trusted_hash: sha256:7954d675ef3bafd5e5a6073ae51d7de57a08f21340f241c332f99078e955675d
        enabled: true
  projects:
    "{{ .chezmoi.workingTree }}":
      trust_level: trusted

claude:
  settings_path: home/.chezmoitemplates/claude-settings-managed.json
  mcp_config_path: home/dot_claude/private_mcp.json.tmpl
  schema: https://json.schemastore.org/claude-code-settings.json
  # No effect on Fable 5 (thinking cannot be disabled there); applies when the
  # interactive profile maps to Sonnet or below.
  alwaysThinkingEnabled: true
  autoUpdates: false
  autoUpdatesChannel: stable
  plansDirectory: ./.agents/worklog/claude
  disableSkillShellExecution: true
  includeGitInstructions: true
  permissions:
    # This must be user-level: project settings do not honour auto; the Stop gate and deny list are the boundaries.
    defaultMode: auto
    # The only managed allow rule: agmsg-dispatch inserts one agmsg row and
    # sends a herdr wake, the sanctioned worker-to-orchestrator wake (T49).
    # It does not authorise chains: "Claude Code is aware of shell operators,
    # so a rule like `Bash(safe-cmd *)` won't give it permission to run the
    # command `safe-cmd && other-cmd`. ... A rule must match each subcommand
    # independently." (code.claude.com/docs/en/permissions) excludedCommands
    # matches the first word only; the allow rule still requires every
    # subcommand to match, so a chained command prompts.
    allow:
      - Bash(agmsg-dispatch:*)
    deny:
      - Bash(sudo:*)
      - Bash(rm -rf:*)
      - Read(.env.*)
      - Read(id_rsa*)
      - Read(id_ed25519*)
      - Edit(.env*)
      - Bash(curl * | sh)
      - Bash(wget * | sh)
      - Read(secrets/**)
      - Read(config/credentials.json)
      - Bash(gh release:*)
      - Bash(npm publish:*)
      - Bash(uv publish:*)
      - Bash(terraform apply:*)
      - Bash(kubectl apply:*)
    ask: []
  # Claude Code Bash sandbox, the counterpart of codex.sandbox_workspace_write:
  # commands may write only the working directory, the session TMPDIR, and
  # filesystem.allowWrite. The generator renders allowWrite from
  # codex.sandbox_workspace_write.writable_roots so both agents share one agmsg
  # writable-roots list; ~/.claude is sandbox-protected, so it is not listed.
  # bubblewrap and socat come from the installers that the operator runs with
  # `make update` outside Claude sessions; on Ubuntu 24.04+ the bwrap-userns
  # AppArmor profile (install/ubuntu/common/apparmor_userns.sh) lets bwrap
  # create user namespaces.
  sandbox:
    enabled: true
    # Two-stage rollout: warn and run unsandboxed while bwrap/socat are missing;
    # flip to true only after live E2E.
    failIfUnavailable: false
    autoAllowBashIfSandboxed: true
    allowUnsandboxedCommands: true
    # Add entries only with E2E evidence, one comment per entry. Claude Code
    # matches an entry against the command's first word (a command name, no
    # patterns; for compound commands and pipes only the first word is
    # checked), and an excluded command still needs a permission allow rule or
    # a normal permission prompt.
    excludedCommands:
      # agmsg-dispatch: inserts one agmsg row and sends a herdr wake. From
      # sandboxed Bash the herdr socket is PermissionDenied (T39 leg 1);
      # outside the sandbox it delivered msgs 545-577 with read_at within
      # seconds (T49 E2E, 2026-10-01).
      - agmsg-dispatch
    filesystem:
      # Rendered into sandbox.filesystem.allowWrite after the Codex writable
      # roots. ~/.cache/uv: every `uv run` target (make unit-test,
      # validate-agent-assets, render-check) needs the uv cache writable; a
      # filesystem relaxation limited to that directory (T39 live E2E leg 1).
      extra_allow_write:
        - ~/.cache/uv
    network:
      allowedDomains:
        - github.com
        - api.github.com
        - uploads.github.com
        - objects.githubusercontent.com
        - codeload.github.com
      # macOS only: Claude Code ignores this list on Linux and WSL2, where the
      # seccomp filter can't inspect socket paths. The Claude messaging socket
      # (CLAUDE_CODE_MESSAGING_SOCKET, a per-process path set at runtime) cannot
      # be listed without a glob, so it is not.
      allowUnixSockets:
        - ~/.config/herdr/herdr.sock
      # The allow-all Unix socket switch is deliberately not set: with a
      # docker-group user or a reachable `systemd --user` bus it turns the
      # auto-approved sandbox into an escape (T44 r2, operator 2026-10-01).
  hooks:
    enforce_uv_hook: ~/.claude/hooks/enforce-uv.sh
    format_edited_files_hook: ~/.claude/hooks/format-edited-files.py
    permission_request:
      command: ~/.local/bin/common/permgate claude
      timeout: 10
      status_message: Evaluating permission request
    session_start:
      - matcher: "^(startup|resume|clear|compact|fork)$"
        hooks:
          - type: command
            # Must stay byte-identical to herdr's own SessionStart entry after
            # template expansion; herdr integration install no-ops on exact match
            # and would otherwise append a duplicate on every `make update`.
            command: "bash '{{ .chezmoi.homeDir }}/.claude/hooks/herdr-agent-state.sh' session"
            timeout: 10
      - matcher: "*"
        hooks:
          - type: command
            command: "{{ .chezmoi.homeDir }}/.local/bin/common/agent-session-staleness hook"
            async: true
            timeout: 5
  statusLine:
    type: command
    command: ccstatusline

plugins:
  marketplace_path: home/dot_agents/plugins/create_marketplace.json
  marketplace:
    name: mryfmo-personal-plugins
    displayName: mryfmo Personal Plugins
  codex_plugins:
    - name: mryfmo-dev-workflows
      version: 0.1.0
      description: Reusable personal development workflows backed by the shared ~/.agents/skills tree.
      author: mryfmo
      license: MIT
      skills: ../../skills
      source_path: ./plugins/mryfmo-dev-workflows
      category: Productivity
      authentication: ON_INSTALL
      installation: AVAILABLE
      interface:
        displayName: mryfmo Dev Workflows
        shortDescription: Shared workflows for GitHub, shell docs, uv, Japanese writing, transformers, and review tasks.
        capabilities:
          - Read
          - Write
    - name: crit
      source_path: ./.codex/plugins/crit
      managed_manifest: false
      category: Developer Tools
      authentication: ON_INSTALL
      installation: INSTALLED_BY_DEFAULT

# MCP servers are declared only when one is enabled for a target agent.
mcp_servers: {}

# The pipeline each task tier runs (T126 V1, its process tier table). scripts/validate-task.py derives a
# task's tier (docs, review or design) and checks that it has an entry here; it enforces nothing from
# the entry yet (T126 W5 and W7 do). The validator reads this block without PyYAML, so keep it to
# nested maps, lists of plain scalars and no `: ` or ` #` inside a value.
process_tiers:
  docs:
    stages:
      - Bot + CI
      - one orchestrator read
      - merge
    profiles:
      worker: express
      audit: none
    limits: 1 revise, 2 h, budget per table
  review:
    stages:
      - V3 worker discipline
      - Bot + CI
      - one schema audit
      - gate
    profiles:
      worker: standard
      audit: audit
    limits: 2 revises, then reset
  design:
    stages:
      - V2 design review
      - V3
      - Bot + CI
      - schema audit with invariant map
      - gate with V5 locks
      - V6 reset rule
      - V9 permgate check
    profiles:
      review: review
      worker: standard
      audit: audit
      redesign: redesign
    limits: 2 revises or 2 implementation-finding audits, then reset

# Third-party assets: one declaration per component with its upstream,
# release, verification, install path, and installer step. `release: latest`
# installs the newest release at install time, verified by the publisher's own
# mechanism (`verify`); a GitHub release is the newest non-draft, non-prerelease
# one at least 72 hours old (scripts/lib/github-release.sh, the same window as
# minimum_release_age in home/dot_mise/config.toml). Only a component whose
# publisher offers no verification keeps a `pin` (with its sha256) and says why
# in `reason`. generate-agent-configs.py renders each `render.constants` entry
# into the named file by rewriting the matching NAME="..." assignment; change
# pins here only, through generate-agent-configs.py --set-asset. `pin: unknown`
# marks a component with no recorded upstream version.
assets:
  mise:
    source: github-release
    upstream: jdx/mise
    release: latest
    verify: release-shasums
    attestation: when-gh-authenticated
    gpg_fingerprint: 24853EC9F655CE80B48E6C3A8B81C9D17413A06D
    note: the newest cooled-down release installs only when gpg and gpgv (SHASUMS256.asc checked against the release key with gpg_fingerprint, fetched from keys.openpgp.org as mise documents) or an authenticated gh (the release attestation) can verify it before it runs; otherwise the fallback release does, and mise self-update moves it forward afterwards.
    fallback:
      pin: v2026.10.3
      sha256:
        macos-x64: 791b92b446729c53e6501acd2b84ea207f541659ca9d0480c9c70c291919a321
        macos-arm64: 28ecc8640b0a28dab52817766f37fecfd898f1dff82e03f36fcb072e971f9246
        linux-x64: 04147c68e946902f5226dfdcd54d19907aed3cf54d95b2f27d2b9c778bb26f9e
        linux-arm64: e79866e32624b346f6854d93ca8a24294516cd7c0b48ce0e80af508fb7c3d8b8
      reason: a host without gpg and without an authenticated gh (a fresh macOS) can check neither the release key's signature nor the release attestation before mise runs, and SHASUMS256.txt comes from the same release; so it bootstraps this reviewed release, SHASUMS256.txt kept as a second check.
    install_path: ~/.local/bin/mise
    installer: install/common/mise.sh
    render:
      file: install/common/mise.sh
      constants:
        MISE_GPG_FINGERPRINT: gpg_fingerprint
        MISE_FALLBACK_VERSION: fallback.pin
        MISE_FALLBACK_MACOS_X64_SHA256: fallback.sha256.macos-x64
        MISE_FALLBACK_MACOS_ARM64_SHA256: fallback.sha256.macos-arm64
        MISE_FALLBACK_LINUX_X64_SHA256: fallback.sha256.linux-x64
        MISE_FALLBACK_LINUX_ARM64_SHA256: fallback.sha256.linux-arm64
  sheldon:
    source: crates
    upstream: sheldon
    release: latest
    verify: cargo-locked
    install_path: ~/.local/bin/sheldon
    installer: install/common/sheldon.sh
  starship:
    source: github-release
    upstream: starship/starship
    pin: v1.26.0
    verify: sha256
    sha256:
      linux-x86_64: b7c232b0e8249d8e55a40beb79c5c43a7d370f3f9408bd215deb0170daeaadf3
      linux-aarch64: dc30189378d2f2e287384e8a692d3f95ad1df64cf0e8c36aa9201516028aed6b
    reason: starship's releases are mutable and carry only .sha256 sidecars, with no signature or attestation (immutable=false, attestations API 404 at v1.26.0); a sidecar from the same release checks the download, not the publisher, so the reviewed sha256 is the check and the sidecar stays as a second one.
    install_path: ~/.local/bin/starship
    installer: install/ubuntu/server/starship.sh
    render:
      file: install/ubuntu/server/starship.sh
      constants:
        STARSHIP_PIN_VERSION: pin
        STARSHIP_X86_64_SHA256: sha256.linux-x86_64
        STARSHIP_AARCH64_SHA256: sha256.linux-aarch64
  aws-cli:
    source: https-download
    upstream: https://awscli.amazonaws.com
    release: latest
    verify: gpg
    gpg_fingerprint: FB5DB77FD5C118B80511ADA8A6310ACC4672475C
    install_path: ~/.local/share/aws-cli
    installer: install/ubuntu/common/aws_cli.sh
    render:
      file: install/ubuntu/common/aws_cli.sh
      constants: {AWS_CLI_FINGERPRINT: gpg_fingerprint}
  homebrew-installer:
    source: git-commit
    upstream: Homebrew/install
    pin: c7952e40b7957268f61643152f4db725379b292e
    verify: sha256
    sha256: 99287f194a8b3c9e6b0203a11a5fa54518be57209343e6bb954dec4635796d9d
    reason: Homebrew publishes its install script without a signature, checksum or release; the commit and script hash are the only check (bootstrap only).
    install_path: Homebrew default prefix (/opt/homebrew or /usr/local)
    installer: install/macos/common/brew.sh
    render:
      - file: install/macos/common/brew.sh
        constants: {HOMEBREW_INSTALL_COMMIT: pin, HOMEBREW_INSTALL_SHA256: sha256}
      - file: setup.sh
        constants: {HOMEBREW_INSTALL_COMMIT: pin, HOMEBREW_INSTALL_SHA256: sha256}
  chezmoi-bootstrap:
    source: github-release
    upstream: twpayne/chezmoi
    release: latest
    verify: release-shasums
    attestation: when-gh-authenticated
    note: chezmoi signs its checksums with cosign only, which a fresh host cannot run; the newest cooled-down release installs only when an authenticated gh can check its release attestation before it runs, otherwise the fallback release does, and mise's own chezmoi takes over after the bootstrap.
    fallback:
      pin: v2.73.0
      sha256:
        darwin-amd64: 55e7b0823b40966a239cb418b37201c5f0961bab1b797c933550c97b1ab08221
        darwin-arm64: 246679a0b200e7e8be4a951be3b95d37c33ecb87eaab5af6f4949f7d0317bcc1
        linux-amd64: b597729b687af4488a848240134cb633de8ca0f04e0d26d48f400ee2ac338ffa
        linux-arm64: abcb840401d3c1f2356e0f53f5d52aa10d10f572654d9626db9ad0ca4dc03355
      reason: setup.sh runs before gh is installed or logged in, so a fresh host cannot check chezmoi's release attestation before chezmoi runs, and its cosign signature needs cosign; it bootstraps this reviewed release, the release's checksums file kept as a second check.
    install_path: ~/.local/bin/chezmoi
    installer: setup.sh#run_chezmoi
    render:
      file: setup.sh
      constants:
        CHEZMOI_FALLBACK_VERSION: fallback.pin
        CHEZMOI_FALLBACK_DARWIN_AMD64_SHA256: fallback.sha256.darwin-amd64
        CHEZMOI_FALLBACK_DARWIN_ARM64_SHA256: fallback.sha256.darwin-arm64
        CHEZMOI_FALLBACK_LINUX_AMD64_SHA256: fallback.sha256.linux-amd64
        CHEZMOI_FALLBACK_LINUX_ARM64_SHA256: fallback.sha256.linux-arm64
  tode:
    source: installer-script
    upstream: https://tode.sh/install
    pin: v0.4.2
    verify: installer-sha256
    sha256: de7c1540305d516ded9734f7dca4ed2d7d308fcc9cdb27a52717c4d26054e933
    note: the install script embeds the sha256 of each platform's payload and checks the download against it, so the script hash also pins the payload.
    reason: zenbu-labs/tode publishes release tarballs with no checksum file or attestation, and the install script is unsigned; an unsigned curl | bash script leaves the committed hash as the only check.
    install_path: ~/.local/bin/tode
    installer: scripts/update-agent-assets.sh#update_terminal_code
    render:
      file: scripts/lib/installer-pins.sh
      constants: {TERMINAL_CODE_PIN_VERSION: pin, TERMINAL_CODE_INSTALLER_SHA256: sha256}
  terminal-browser:
    source: installer-script
    upstream: https://terminal-browser.sh/install
    pin: v0.13.4
    verify: installer-sha256
    sha256: 11b3f157debcf9bb8e5d8c6a5efc16fb9385ccb97478ae8bdb0fb0ea9e1f23bc
    note: the install script embeds the sha256 of each platform's payload and checks the download against it, so the script hash also pins the payload.
    reason: zenbu-labs/terminal-browser publishes release tarballs with no checksum file or attestation, and the install script is unsigned; an unsigned curl | bash script leaves the committed hash as the only check.
    install_path: ~/.local/bin/terminal-browser
    installer: scripts/update-agent-assets.sh#update_terminal_browser
    render:
      file: scripts/lib/installer-pins.sh
