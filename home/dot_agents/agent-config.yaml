    reason: Understand-Anything serves its install script only as a raw repository file, with no signature or checksum (its releases ship a viewer bundle, not the script); the commit and script hash are the only check.
    install_path: ~/.understand-anything/repo
    installer: scripts/update-agent-assets.sh#update_codex_understand_anything
    render:
      file: scripts/update-agent-assets.sh
      constants:
        CODEX_UNDERSTAND_ANYTHING_INSTALLER_COMMIT: pin
        CODEX_UNDERSTAND_ANYTHING_INSTALLER_SHA256: sha256
  compactiondb:
    source: vendored
    upstream: this repository (vendor/compactiondb)
    pin: 2.0.0+dotfiles.9
    verify: manifest-sha256
    manifest: vendor/compactiondb/MANIFEST.sha256
    note: >-
      a clean-room implementation kept in this repository (vendor/compactiondb/NOTICE.md), so
      there is no external upstream to follow: the tree in this repository is the source of
      truth, and MANIFEST.sha256 checks that the installed copy is that tree.
    install_path: ~/.agents/compactiondb
    installer: scripts/update-agent-assets.sh#update_compactiondb
  claude-plugins:
    source: claude-plugin
    upstream: marketplaces
    pin: per-plugin
    verify: installed-version
    note: >-
      each pin is the version both hosts ran on 2026-10-25 (~/.claude/plugins/installed_plugins.json
      on macOS and spark-9e8d). Only the user-scope installation is managed, the scope this
      repository installs; a project- or local-scope installation belongs to its project, and make
      update and make doctor report it as not managed. Claude Code installs a plugin only at its
      marketplace's current release and takes no version, so scripts/update-agent-assets.sh leaves
      a user-scope installation at its pin alone (its enabled state included), installs a missing
      one from the marketplace recorded here (registering it first), updates one that is not at
      its pin, and disables it at user scope when it is still off its pin afterwards, proven by an
      explicit false in ~/.claude/settings.json: Claude Code runs a plugin's hooks with no trust
      step, so only a reviewed version stays enabled. Every claude call runs from an empty
      directory. Any failure (records unreadable, marketplace not registered, install failed,
      disable not proven) fails the run. This list drives that loop, so every plugin here is
      converged, pstack included (installed by hand from the cursor/plugins marketplace;
      assets.pstack deploys its skills). make doctor fails when a user-scope installed version
      differs from its pin and warns for a plugin the user settings enable without a pin here.
      To move a plugin, review the upstream release, set its pin here, regenerate, then make update.
      pyright-lsp and frontend-design are the exception to the first sentence: their pins are the
      marketplace's listing on 2026-10-26 (spark-9e8d ran both, macOS neither). pyright-lsp ships
      no hooks, commands or servers of its own, only an lspServers entry that starts
      pyright-langserver --stdio, the binary mise installs (npm:pyright). frontend-design ships one
      skill (skills/frontend-design/SKILL.md, prompt text) and nothing that runs. Its listing and
      manifest have no version, so Claude Code records the marketplace commit it installed from
      (12 hex digits), which moves with every marketplace commit while the files stay the same; a
      marketplace source takes a ref only as a branch or tag, not a commit (code.claude.com
      marketplace reference, marketplace sources), and anthropics/claude-plugins-official has no
      tags. Such a plugin is pinned by content instead: pin sha256:<hex>, the hash
      scripts/pin_records.py content_digest takes over what Claude Code loads for it, its catalog
      entry in the marketplace's .claude-plugin/marketplace.json (which can itself define hooks or
      servers) and the files of its plugin directory. make update and make doctor compare it, from
      the installed copy and the installed marketplace clone, in place of the version, and make
      drift from the upstream catalog and tree (equal at 58267944f921, d4226d062928 and the seven
      other versions spark-9e8d cached, and upstream, on 2026-10-26). The reviewed tree and entry
      are kept at tests/fixtures/claude-plugins/<plugin> and
      tests/fixtures/claude-plugins/marketplaces/<marketplace>; moving such a pin replaces both.
    plugins:
      superpowers@claude-plugins-official: {marketplace: anthropics/claude-plugins-official, pin: 7.0.0}
      pyright-lsp@claude-plugins-official: {marketplace: anthropics/claude-plugins-official, pin: 1.0.0}
      frontend-design@claude-plugins-official: {marketplace: anthropics/claude-plugins-official, pin: 'sha256:a0625c75cf136cb5008e19640134229e6a35daf1c907eadce3271ca0ff4401c0'}
      crit@crit: {marketplace: tomasz-tomczyk/crit, pin: 1.8.14}
      ponytail@ponytail: {marketplace: DietrichGebert/ponytail, pin: 5.3.2}
      understand-anything@understand-anything: {marketplace: Egonex-AI/Understand-Anything, pin: 2.9.7}
      pstack@cursor-plugins: {marketplace: cursor/plugins, pin: 0.15.30}
  codex-plugins:
    source: codex-plugin
    upstream: marketplaces
    pin: per-plugin
    verify: installed-version
    note: >-
      each pin is the version both hosts ran on 2026-10-25 (the plugin.json of the copy under
      ~/.codex/plugins/cache that Codex loads, on macOS and spark-9e8d). A plugin with a ref comes
      from a git marketplace that the Codex config fetches at that commit (`ref` under
      [marketplaces.<name>], rendered from here; `codex plugin marketplace upgrade` stays on it),
      and ponytail's hooks are trusted only at the trusted_hash pins under codex.hooks.state.
      superpowers comes from the OpenAI-curated catalog, which takes no version, so make update
      only compares it. make doctor fails when an installed version or a marketplace revision
      differs from its pin. The crit plugin is the local copy `crit install codex-plugin` writes
      for the pinned crit release (assets.crit).
    plugins:
      superpowers@openai-curated: {marketplace: openai-curated, pin: 6.3.0}
      ponytail@ponytail:
        marketplace: https://github.com/DietrichGebert/ponytail.git
        pin: 5.3.2
        ref: 09c434ab73ca43761c5d8b0c5d341926c2fba710
  gh-extensions:
    source: gh-extension
    upstream: https://github.com/seachicken/gh-poi
    pin: v0.18.5
    verify: installed-version
    reason: gh-poi's releases are mutable and carry only a checksums.txt from the same release, with no signature or attestation (immutable=false, attestations API 404 at v0.18.5); `gh extension install --pin` installs exactly this reviewed tag, and make doctor fails when the installed tag differs.
    installer: install/common/gh_extensions.sh
    note: the version both hosts ran on 2026-10-25 (gh extension list).
    render:
      file: install/common/gh_extensions.sh
      constants: {GH_POI_PIN_VERSION: pin}
