# Canonical AI-agent configuration managed by chezmoi.
#
# This file is the single source of truth for Codex, Claude Code and omp.
# Agent-native files are generated from this manifest by scripts/generate-agent-configs.py, which also lists every
# file it renders; `--check`, validate-agent-assets.py and make doctor fail on a file in a generated directory that
# this manifest does not render.
#
# Best-practice rules encoded here:
# - Define one shared capability catalog and render native adapters for every agent.
# - Keep shared skills in ~/.agents/skills and expose the same skill set to every agent.
# - Keep MCP servers disabled by default; enable only after checking scope and credentials.
# - Store credentials as environment-variable references or inherited environment only.
# - Use current maintained MCP servers; deprecated packages are rejected by validation.

schema_version: 1

# Standing rules: the user-level instructions every session of an agent starts with. Each rule is one
# Markdown file, source_dir/<name>.md, and reaches exactly the agents its audience names; every file in
# source_dir is declared here and nothing else renders to an agent (scripts/generate-agent-configs.py).
# The rendered files include the source at chezmoi apply time, so a checkout alone changes no agent's
# instructions:
# - claude: ~/.claude/rules/<name>.md, one file per rule (Claude Code loads every file there).
# - codex: ~/.codex/AGENTS.md, the codex rules in the order below.
# - omp-<role>: ~/.agents/omp/rules/<role>.md, which hcom-seat and omp-run.sh pass as
#   `--append-system-prompt` (omp docs system-prompt-customization.md). The seat overlays disable the
#   native provider (seat_disabled_providers), so no profile context file loads, and omp reads no
#   ~/.claude rule and no ~/.codex file; the explicit flag also wins over any project APPEND_SYSTEM.md.
#   The audit role takes none: its rules are origin/main AGENTS.md alone.
# A rule with front matter (Claude's `paths:` scoping) is Claude-only; the generator refuses it elsewhere.
standing_rules:
  source_dir: home/dot_config/claude/rules
  rules:
    codex: [codex]
    regime: [claude, omp-orchestrator, omp-worker]
    model-selection: [claude, codex, omp-orchestrator, omp-worker]
    compactiondb: [claude, codex, omp-orchestrator, omp-worker]
    ponytail: [claude, codex]
    understand-anything: [claude, codex]
    ask-user-question: [claude]
    project-map: [claude]
    python: [claude]
    gpu: [claude]
    latex: [claude]
  # pstack's per-role models in Claude Code: ~/.claude/rules/pstack-models.md, the file the pstack Claude
  # Code adapter (~/.agents/docs/harness/claude-code.md "Models") reads in place of Cursor's
  # ~/.cursor/rules/pstack-models.mdc. A role names a model_profiles entry, rendered as `<alias> <effort>`
  # from its claude model and effort, or inherit-parent / auto (the parent chat model); a list is a panel.
  # setup-pstack's own write to that file is replaced at the next chezmoi apply: change the roles here.
  pstack_models:
    budget: large (xhigh)
    roles:
      feature, refactoring: inherit-parent
      bug-fix: inherit-parent
      perf-issue: inherit-parent
      hillclimb: inherit-parent
      judgment and prose: standard
      hardest tasks: standard
      how explorer: inherit-parent
      how explainer: standard
      why investigators: inherit-parent
      why synthesizer: standard
      reflect tooling: inherit-parent
      reflect judgment, divergent, synthesizer: standard
      arena runners: [standard, inherit-parent]
      arena cross-judge pool: [standard, inherit-parent]
      swarm workers: inherit-parent
      architect runners: [standard, inherit-parent]
      interrogate reviewers: [standard, inherit-parent]

# omp seats load skills from these roots through skills.customDirectories in
# ~/.omp/agent/config.yml (docs/omp-skills.md). omp 18.11.3 also scans
# ~/.agents/skills by default; the key pins that against a settings change.
omp:
  skills_directories:
    - ~/.agents/skills
  # Extension directories a plain `omp` launch loads, rendered as the top-level `extensions`
  # key of ~/.omp/agent/config.yml. omp skips a default model whose provider is not registered
  # and starts on another one, so validate-agent-assets.py refuses an interactive_profile omp model
  # whose extension provider is missing here. Seats use named profiles, which never read that
  # file; hcom-seat passes their extensions with -e (docs/pi-claude-bridge.md).
  extensions:
    - ~/.local/lib/omp-extensions/pi-claude-bridge
  # The omp model provider each extension directory registers; a model route missing here is
  # omp-builtin (anthropic). validate-agent-assets.py requires every directory here and in
  # omp.extensions to be one of claude.levers.extensions, the seats' only -e directories.
  extension_providers:
    claude-bridge: ~/.local/lib/omp-extensions/pi-claude-bridge
    openai-siwc: ~/.agents/omp/extensions/openai-siwc
  # omp providers each seat overlay and the plain-launch config switch off as disabledProviders
  # (regime-cutover U22). openai-codex is the retired route: disabled, no stored OAuth session
  # makes it selectable (omp docs/providers.md).
  # agent-plugins reads the Claude Code marketplace registry, where pstack is installed as
  # a plugin too: its copy of the skills ~/.agents/skills already lists is refused with one
  # warning per skill (56 on omp 18.11.3, measured). The seats load no Agent Plugin (the
  # bridge and SIWC packages carry no plugin.json, mcp.json or skills/), so nothing is lost.
  # omp reads the same key for model providers, so the generator refuses a model route here.
  disabled_providers:
    - agent-plugins
    - openai-codex
  # Discovery providers the seat role overlays (~/.agents/omp/profiles/<role>.yml) switch off on
  # top of disabled_providers; the plain-launch config keeps them (regime-cutover U66, F005).
  # --no-extensions stops only extension modules: measured on omp 18.11.3 under a scratch HOME,
  # a cwd's .omp/tools/*.ts still ran and its .omp/mcp.json and .mcp.json still started their
  # server process, and both stopped with these providers off, while the cwd's AGENTS.md
  # (agents-md) and the skills.customDirectories skills still loaded. Each one reads code,
  # MCP servers, hooks or settings from the project tree (getAllProvidersInfo). The seat
  # profile directories hold no native user-level files, so native costs nothing there.
  # omp still merges a cwd's .omp/config.yml at start whatever this list says (the list binds
  # only after settings load), so hcom-seat refuses a seat directory that holds .omp.
  seat_disabled_providers:
    - native
    - claude
    - codex
    - gemini
    - opencode
    - cursor
    - windsurf
    - vscode
    - mcp-json
  # A plain `omp` launch (~/.omp/agent/config.yml, merged by modify_private_config.yml) keeps omp's
  # approval mode (default yolo): the operator drives those sessions, the coordinator among them, and
  # they run gate-free by design (coordinator decision on U66 F043). It gets only outright denies,
  # which omp honours in every mode: the debug tool and the bridge's AskClaude (both run programs
  # outside bash.patterns), and the seat policies' common bash deny list
  # (home/dot_agents/omp/policies/README.md), so a plain launch refuses the same commands a seat
  # does; tests/unit/test_omp_seat_policy.py fails when the copies drift. eval stays allowed here
  # (the operator's sessions use it), so a shell started through eval bypasses the bash list. The
  # seats use named profiles and their own --config policy, never this file.
  interactive_policy:
    tool_deny:
      - debug
      - AskClaude
    bash_deny:
      - "*sudo *"
      - "*rm -rf *"
      - "*curl *|*sh"
      - "*curl *|*sh *"
      - "*wget *|*sh"
      - "*wget *|*sh *"
      - "*gh release*"
      - "*npm publish*"
      - "*uv publish*"
      - "*terraform apply*"
      - "*kubectl apply*"
      - "*gh pr merge*"
      - "*gh pr edit*"
      - "*gh pr close*"
      - "*gh pr review*"
      - "*gh pr update-branch*"
      - "*gh issue*"
      - "*gh api* -X POST*"
      - "*gh api* --method POST*"
      - "*gh api* -XPOST*"
      - "*gh api* --method=POST*"
      - "*gh api* -X PATCH*"
      - "*gh api* --method PATCH*"
      - "*gh api* -XPATCH*"
      - "*gh api* --method=PATCH*"
      - "*gh api* -X PUT*"
      - "*gh api* --method PUT*"
      - "*gh api* -XPUT*"
      - "*gh api* --method=PUT*"
      - "*gh api* -X DELETE*"
      - "*gh api* --method DELETE*"
      - "*gh api* -XDELETE*"
      - "*gh api* --method=DELETE*"
      - "*gh api* -f*"
      - "*gh api* -F*"
      - "*gh api* --field*"
      - "*gh api* --raw-field*"
      - "*gh api* --input*"
  # Seat role -> model profile. One overlay per role renders to
  # ~/.agents/omp/profiles/<role>.yml with that profile's omp model as
  # modelRoles.default and skills_directories as skills.customDirectories; the
  # seat launcher passes it as a second --config (docs/omp-skills.md).
  roles:
    orchestrator: deep
    worker: standard
    audit: audit
    review: review
    security: security

# Model IDs and efforts live only in this map. Profiles render into Claude
# settings, per-profile Codex config files (~/.codex/<name>.config.toml), and
# ~/.agents/model-profiles.env for launchers. Keep main-session models fixed
# within a session; switching models mid-session invalidates the prompt cache.
# omp.effort is the seat's thinking level, rendered as defaultThinkingLevel into each role overlay
# (~/.agents/omp/profiles/<role>.yml); it follows the effort of the vendor the omp model routes to.
model_profiles:
  express:
    claude: { model: haiku, effort: low }
    codex: { model: gpt-5.6-luna, model_reasoning_effort: low }
    omp: { model: "claude-bridge/claude-haiku-5-5", effort: low }
  standard:
    claude: { model: claude-opus-5-5, effort: xhigh, advisor: fable }
    codex:
      model: gpt-6.1-sol
      model_reasoning_effort: xhigh
      notify: ['{{ .chezmoi.homeDir }}/.local/bin/common/contextdb-codex-notify']
    omp: { model: "claude-bridge/claude-opus-5-5", effort: xhigh }
  review:
    # Review independence rests on a fresh context, not a stronger model (operator decision 2026-10-13, plan 007 T717);
    # INV-7: the Claude review profile is the same model and effort as deep.
    claude: { model: claude-fable-5-1, effort: xhigh }
    codex: { model: gpt-6.1-sol, model_reasoning_effort: xhigh }
    omp: { model: "claude-bridge/claude-fable-5-1", effort: xhigh }
  deep:
    claude: { model: claude-fable-5-1, effort: xhigh, advisor: fable }
    codex:
      model: gpt-6.1-sol
      model_reasoning_effort: xhigh
      notify: ['{{ .chezmoi.homeDir }}/.local/bin/common/contextdb-codex-notify']
    omp: { model: "claude-bridge/claude-fable-5-1", effort: xhigh }
  security:
    # Security-audit tier: specialist model for auditing pending changes. An audit reads
    # the changes and reports; it never edits, so it runs read-only like the audit tier.
    claude: { model: claude-fable-5, effort: high }
    codex:
      # gpt-daybreak-blue-latest requires API-key auth (rejected under ChatGPT login).
      model: gpt-6-astra
      model_reasoning_effort: high
      sandbox_mode: read-only
      notify: ['{{ .chezmoi.homeDir }}/.local/bin/common/contextdb-codex-notify']
    omp: { model: "openai-siwc/gpt-6-astra", effort: high }
  audit:
    # Auditor tier (監査役): cross-vendor read-only audit of worker changesets
    # at xhigh reasoning effort (operator pin 2026-10-09, T115).
    claude: { model: claude-fable-5-1, effort: high }
    codex:
      model: gpt-6-astra
      model_reasoning_effort: xhigh
      sandbox_mode: read-only
      notify: ['{{ .chezmoi.homeDir }}/.local/bin/common/contextdb-codex-notify']
    omp: { model: "openai-siwc/gpt-6-astra", effort: xhigh }
interactive_profile: deep

codex:
  config_path: home/.chezmoitemplates/codex-config-managed.toml
  model_reasoning_summary: concise
  model_verbosity: low
  personality: pragmatic
  approval_policy: on-request
  sandbox_mode: workspace-write
  web_search: cached
  check_for_update_on_startup: false
  project_doc_max_bytes: 65536
  project_doc_fallback_filenames:
    - CLAUDE.md
  tui:
    status_line:
      - model-with-reasoning
      - context-remaining
      - used-tokens
      - total-input-tokens
      - total-output-tokens
      - five-hour-limit
      - weekly-limit
      - git-branch
    model_availability_nux:
      gpt-5.6-sol: 2
  sandbox_workspace_write:
    network_access: false
    writable_roots: []
  shell_environment_policy:
    inherit: core
    set:
      # mise shims resolve node from mise's config, so no per-version node directory goes first;
      # /opt/homebrew/bin exists only on macOS (the base modify script renders the os conditional).
      PATH: '{{ .chezmoi.homeDir }}/.local/share/mise/shims:{{ .chezmoi.homeDir }}/.local/bin:{{ .chezmoi.homeDir }}/.local/bin/common:{{ if eq .chezmoi.os `darwin` }}/opt/homebrew/bin:{{ end }}/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin'
  features:
    plugins: true
    hooks: true
    plugin_hooks: true
  plugins:
    superpowers@openai-curated:
      enabled: true
    crit@mryfmo-personal-plugins:
      enabled: true
    ponytail@ponytail:
      enabled: true
  marketplaces:
    # last_updated/last_revision render from assets.codex-plugins.
    ponytail:
      source_type: git
      source: https://github.com/DietrichGebert/ponytail.git
  hooks:
    permission_request:
      command: '{{ .chezmoi.homeDir }}/.local/bin/common/permgate codex'
      timeout: 10
      status_message: Evaluating permission request
    # Compaction and session end reach CompactionDB like Claude's hooks do; the
    # profiles' notify entries still carry each turn's assistant message.
    command_hooks:
      - event: PreCompact
        command: '{{ .chezmoi.homeDir }}/.local/bin/common/contextdb-codex-notify'
        timeout: 10
        status_message: Recording to CompactionDB
      - event: PostCompact
        command: '{{ .chezmoi.homeDir }}/.local/bin/common/contextdb-codex-notify'
        timeout: 10
        status_message: Recording to CompactionDB
      - event: SessionEnd
        command: '{{ .chezmoi.homeDir }}/.local/bin/common/contextdb-codex-notify'
        timeout: 3
        status_message: Recording to CompactionDB
    # The hooks this repository ships or installs. The modify scripts hash each one at apply time: a config
    # hook from its manifest definition embedded in the modify script is trusted at that hash; a plugin hook
    # from the installed plugin file is trusted only when that hash equals its trusted_hash pin, so a plugin
    # release `make update` installed stays untrusted (apply and `make doctor` warn) until it is reviewed in
    # /hooks and its hash is recorded here. The pin is written as is when the plugin file is absent.
    state:
      '{{ .chezmoi.homeDir }}/.codex/config.toml:permission_request:0:0':
        enabled: true
      '{{ .chezmoi.homeDir }}/.codex/config.toml:pre_compact:0:0':
        enabled: true
      '{{ .chezmoi.homeDir }}/.codex/config.toml:post_compact:0:0':
        enabled: true
      '{{ .chezmoi.homeDir }}/.codex/config.toml:session_end:0:0':
        enabled: true
      crit@mryfmo-personal-plugins:hooks/hooks.json:stop:0:0:
        trusted_hash: sha256:bf6ad428ae7902810fa2d68d8db42228377af118aa18508ad0eccf73a95ed1f8
        enabled: true
      ponytail@ponytail:hooks/claude-codex-hooks.json:session_start:0:0:
        trusted_hash: sha256:7ee5d5ae1f4a9e55f1f429f2960c2f9f32293f198c0e8e2e42b2fb3b4eeda142
        enabled: true
      ponytail@ponytail:hooks/claude-codex-hooks.json:user_prompt_submit:0:0:
        trusted_hash: sha256:8c9efc5a5e649c8cdca3f0b7bf4cba81d9717d1bc930c7dbc18b6efd66c7c58c
        enabled: true
      ponytail@ponytail:hooks/claude-codex-hooks.json:subagent_start:0:0:
        trusted_hash: sha256:7954d675ef3bafd5e5a6073ae51d7de57a08f21340f241c332f99078e955675d
        enabled: true
  projects:
    "{{ .chezmoi.workingTree }}":
      trust_level: trusted

claude:
  settings_path: home/.chezmoitemplates/claude-settings-managed.json
  schema: https://json.schemastore.org/claude-code-settings.json
  # No effect on Fable 5 (thinking cannot be disabled there); applies when the
  # interactive profile maps to Sonnet or below.
  alwaysThinkingEnabled: true
  # No update keys (regime-cutover U18): mise's `npm:@anthropic-ai/claude-code`
  # entry is the only version channel, and DISABLE_UPDATES/DISABLE_AUTOUPDATER in
  # home/dot_zshenv and home/dot_profile block Claude Code's own updater.
  # `autoUpdatesChannel` would name a channel the mise install never follows,
  # and `autoUpdates` is not a settings key (`{"autoUpdates": false}` alone:
  # `claude doctor` 2.1.309 reports `Auto-updates: enabled`).
  plansDirectory: ./.agents/worklog/claude
  disableSkillShellExecution: true
  includeGitInstructions: true
  permissions:
    # This must be user-level: project settings do not honour auto; the Stop gate and deny list are the boundaries.
    defaultMode: auto
    # The five rules are the coordinator's levers (regime-cutover U16,
    # scripts/orchestrator/README.md
    # "Pre-authorized levers"): deterministic wrappers that validate their own
    # input, plus the read-only `hcom list`. Each lever rule names the copy
    # chezmoi installs under ~/.local/bin/common (claude.levers below), which a
    # sandboxed session cannot write and which checks its own sha256 at start
    # (U31), never the rewritable checkout path; so the rules render on Linux
    # and WSL2 too. No lever leaves the sandbox: `allowUnsandboxedCommands` is
    # false and no lever is in `sandbox.excludedCommands`, so an allow rule only
    # ever approves a sandboxed run (U68). Not `Bash(hcom *)` (hcom launches
    # agents), no interpreter prefix;
    # validate-agent-assets.py refuses anything else, a checkout path included.
    # No rule authorises chains: "Claude Code is aware of shell operators,
    # so a rule like `Bash(safe-cmd *)` won't give it permission to run the
    # command `safe-cmd && other-cmd`. ... A rule must match each subcommand
    # independently." (code.claude.com/docs/en/permissions)
    allow:
      - Bash(~/.local/bin/common/hcom-seat *)
      - Bash(~/.local/bin/common/hcom-dispatch *)
      - Bash(~/.local/bin/common/bus-history.sh *)
      - Bash(~/.local/bin/common/worktree-gc.sh *)
      - Bash(~/.local/bin/common/regime-init *)
      - Bash(hcom list *)
    # Secret files are guarded at two layers (regime-cutover U17). These
    # Read/Edit rules guard Claude's own file tools and the file commands it
    # recognises in Bash; they "don't apply to … arbitrary subprocesses"
    # (code.claude.com/docs/en/permissions). `sandbox.credentials` and
    # `sandbox.filesystem.denyRead` below guard every sandboxed subprocess.
    # The Linux sandbox ignores a Read/Edit rule whose last segment is a glob
    # when it builds its own read and write lists ("Those wildcards don't work
    # for sandboxed commands", code.claude.com/docs/en/sandboxing), so
    # validate-agent-assets.py refuses one except the `.env` pair. The pair
    # keeps its glob because the Read and Edit tools must refuse `.env.local`
    # and the like in every project, which only a glob expresses; the tools
    # apply it on every OS. For sandboxed subprocesses on Linux the `denyRead`
    # globs below cover reads; a sandboxed write to a `.env*` file inside the
    # working directory is not blocked there, since Linux `denyWrite` accepts
    # only a trailing `/**` (known limit, U68).
    deny:
      - Bash(sudo:*)
      - Bash(rm -rf:*)
      - Read(.env)
      - Read(.env.*)
      - Read(~/.ssh/**)
      - Edit(.env*)
      - Bash(curl * | sh)
      - Bash(wget * | sh)
      - Read(secrets/**)
      - Read(config/credentials.json)
      - Bash(gh release:*)
      - Bash(npm publish:*)
      - Bash(uv publish:*)
      - Bash(terraform apply:*)
      - Bash(kubectl apply:*)
    # shortcut: flags after the API path escape prefix rules; the integration gate remains authoritative.
    ask:
      - Bash(gh pr merge:*)
      - Bash(gh pr create:*)
      - Bash(gh pr comment:*)
      - Bash(gh pr review:*)
      - Bash(gh pr close:*)
      - Bash(gh pr edit:*)
      - Bash(gh pr update-branch:*)
      - Bash(gh issue:*)
      - Bash(gh api -X POST:*)
      - Bash(gh api --method POST:*)
      - Bash(gh api -XPOST:*)
      - Bash(gh api --method=POST:*)
      - Bash(gh api -X PATCH:*)
      - Bash(gh api --method PATCH:*)
      - Bash(gh api -XPATCH:*)
      - Bash(gh api --method=PATCH:*)
      - Bash(gh api -X PUT:*)
      - Bash(gh api --method PUT:*)
      - Bash(gh api -XPUT:*)
      - Bash(gh api --method=PUT:*)
      - Bash(gh api -X DELETE:*)
      - Bash(gh api --method DELETE:*)
      - Bash(gh api -XDELETE:*)
      - Bash(gh api --method=DELETE:*)
      - Bash(gh api -f:*)
      - Bash(gh api -F:*)
      - Bash(gh api --raw-field:*)
      - Bash(gh api --field:*)
      - Bash(gh api -f*)
      - Bash(gh api -F*)
      - Bash(gh api --raw-field=*)
      - Bash(gh api --field=*)
      # The two commands that run outside the sandbox (sandbox.excludedCommands
      # below) prompt every time, in auto mode too: ask rules are evaluated
      # before allow rules (code.claude.com/docs/en/permissions) (U68).
      - Bash(git push *)
      - Bash(gh *)
  env:
    GH_TELEMETRY: "false"
    DO_NOT_TRACK: "1"
    CHECKPOINT_DISABLE: "1"
    AWS_EC2_METADATA_DISABLED: "true"
  # The coordinator's levers (regime-cutover U31). The generator renders
  # home/dot_local/bin/common/executable_<name> from scripts/orchestrator/<name>
  # (same bytes; chezmoi installs it as ~/.local/bin/common/<name>, mode 0755,
  # outside every Claude sandbox write root) and refreshes the pins below. The
  # copy is not read-only: its owner can rewrite it and this manifest. The guard
  # is detection: each lever refuses to run (exit 2) when its own sha256 differs
  # from its line here, read from the deployed ~/.agents/agent-config.yaml for
  # the installed copy. regime-env is the
  # helper the levers source for the per-repository derivation (U33): pinned
  # and self-checked like a lever, but sourced, never run, so no allow rule;
  # regime-init reads its templates from ~/.agents/regime beside this manifest.
  # The pr-*.sh and records-sync.sh pins are the omp seats' GitHub-write levers
  # (U28): the same install and self-check, allowed by the seat policies under
  # ~/.agents/omp/policies, never by a claude.permissions rule. omp-run.sh is
  # the one-turn omp runner the audit path uses (U66): installed and
  # self-checked the same way, so every repository runs the same pinned copy.
  # pr-merge.sh is the orchestrator's only merge path (a `correct` ledger row
  # for the exact head and green CI, U71).
  levers:
    sha256:
      hcom-seat: 0294ae3e5f52980e5b4737cae61b7bb78ea96c4437d2d9caad0d0143ddad17ba
      hcom-dispatch: b7883a16f2902933ca7d627ea3c1c1c434558c27e40b2546cfe3dd59e5f04274
      bus-history.sh: e27cac5048ca6ef1abf6637d5518b1a481df9974929c03c715ba9f59d2115cf2
      worktree-gc.sh: 4b2889fb20d87140f4541a63931533cc6bc09c7aab706d0447f1e800ed513293
      regime-env: d0d516db313b272a019ac565abd248da6eea6f7b9ec49f39293d111ad99e6dba
      regime-init: f6b9443069d7d9b0a195a8bd1a3b0562e54a73effe3fb2b2f587c68bb4789324
      seat-login-preflight: 863694c760a1180cebdb897d418b02bccf8caa9895ec949b0290e695f1b5dc15
      regime-start: 531ec6fed3531fc7b09ebbef43d51e78b80c68cf89c6c3683a87d562603af142
      regime-stop: be35aa95f6cccc36f26ac95a8952daf9f1f647365107cd13802eeebdbf555e96
      pr-thread-reply.sh: 5782b2d7fc35f8d07bfd7286f7f7998d5661c9dcf754b0b1b78dbf439d250037
      pr-thread-resolve.sh: 382dbe41f7b4e494c27a62650cb40bfecbbe3b31502f1d6c1beab787d3073123
      pr-update-branch.sh: c5a2d4ffcc6ffc238082e8074cda81aab85cc798317688175c2aa97c2eb276ae
      pr-close.sh: 113fff0163e77ad57f05b031962d46d6f7886da7ff47b4779acfd752985e996a
      pr-body-edit.sh: 23b3b595c6af815731d0a8a76c10394716dd3cfaf0d2824db1b9986d348b88ee
      pr-threads-check.sh: 7cd92e2610b088efd86106a8e181c3cd8f01486c7731c835165c892ed58d0610
      records-sync.sh: 401dbb2c3ea86a2114c6465bebbad5c8bbcc036703f38daf2e76f8dc364c40c7
      pr-merge.sh: bdb32ef369f98af58a83b3a5a70774b0cc12150eb21f1a2b530ff86d0b660c79
      omp-run.sh: 3577b01102954ac8bf3dfd4dcbcb65e868dc653dec4272fc04e491bb816a8ec5
    # The only extension directories `hcom-seat` passes with `-e`, by default or
    # through `--ext`: the pi-claude-bridge, the openai-siwc extension, and the
    # stop gate's directory, which every launch loads (regime-cutover U33c).
    # hcom's own delivery extension is the one other `-e` (hcom adds it). The
    # seat shim runs omp with --no-extensions, so no ambient module (the cwd's
    # .omp/extensions, .omp/hooks, .omp/plugins, a settings `extensions` entry,
    # an installed plugin) loads beside them (U85, U66 F005).
    extensions:
      - ~/.local/lib/omp-extensions/pi-claude-bridge
      - ~/.agents/omp/extensions/openai-siwc
      - ~/.agents/omp/hooks
  # Claude Code Bash sandbox, the counterpart of codex.sandbox_workspace_write:
  # commands may write only the working directory, the session TMPDIR, and
  # filesystem.allowWrite. The generator renders allowWrite from
  # codex.sandbox_workspace_write.writable_roots so both agents share one
  # writable-roots list; ~/.claude is sandbox-protected, so it is not listed.
  # bubblewrap and socat come from the installers that the operator runs with
  # `make update` outside Claude sessions; on Ubuntu 24.04+ the bwrap-userns
  # AppArmor profile (install/ubuntu/common/apparmor_userns.sh) lets bwrap
  # create user namespaces.
  sandbox:
    enabled: true
    # Refuse to start rather than run commands unsandboxed: bwrap, socat and the
    # bwrap-userns AppArmor profile are in place on the Ubuntu host and macOS uses
    # Seatbelt (code.claude.com/docs/en/settings-reference, failIfUnavailable).
    failIfUnavailable: true
    autoAllowBashIfSandboxed: true
    # Strict sandbox mode: Claude Code ignores the `dangerouslyDisableSandbox`
    # retry, so a command runs sandboxed unless it matches excludedCommands
    # (code.claude.com/docs/en/sandboxing, "Turn off the retry with strict
    # sandbox mode"; measured in the installed 2.1.310 code, U68).
    allowUnsandboxedCommands: false
    # Two exclusions, each behind its identical ask rule above. An excluded
    # command goes through the regular permission flow, so each one prompts.
    # `git push`: the git config rewrites GitHub pushes to SSH (pushInsteadOf)
    # and the sandbox denies ~/.ssh, so a push cannot run sandboxed. `gh`: the
    # gh hosts file is denied to sandboxed commands, so gh authenticates only
    # outside the sandbox. A call with a `cd`, `-C`, a redirect or a command
    # substitution stays sandboxed and fails. herdr calls and `hcom-seat` on
    # macOS need the herdr socket and are not excluded: launch seats from the
    # omp orchestrator or a terminal.
    excludedCommands:
      - git push *
      - gh *
    linux_excluded_commands: []
    filesystem:
      # Rendered into sandbox.filesystem.allowWrite after the Codex writable
      # roots. Each entry must be byte-identical to validate-agent-assets.py
      # SANDBOX_WRITE_ROOTS (DARWIN_SANDBOX_WRITE_ROOTS for the darwin list):
      # a new root is a reviewed change to that allowlist (U68). Cache and state
      # directories only: nothing on PATH and nothing a later unsandboxed run
      # trusts as configuration. ~/.cache/uv: every
      # `uv run` target (make unit-test, validate-agent-assets, render-check)
      # needs the uv cache writable (T39 live E2E leg 1). ~/.local/share/uv
      # (uv tools and Pythons, the hcom binary on PATH) and ~/.local/state/mise
      # (mise's trusted-configs) are not writable: measured under Seatbelt, `uv
      # run --with pyyaml`, `uv run --no-project` and `mise exec` succeed without
      # them; mise only warns that it could not track a new checkout's mise.toml.
      extra_allow_write:
        - ~/.cache/uv
        # The dotfiles program's hcom store until its one-time move (U16; README "Run a program in another repository").
        - ~/.local/state/hcom-regime
        # The derived per-repository stores ~/.local/state/hcom/<slug> (regime-env, U33); no part may be a symlink.
        - ~/.local/state/hcom
        # The omp seat worktrees, which `hcom-seat worker` creates and reuses (U16, U33).
        - ~/.local/state/omp-seats
      darwin_extra_allow_write:
        - ~/Library/Caches/mise
      # Rendered as sandbox.filesystem.denyRead on every OS: the sandbox's
      # default read policy "still allows reading credential files" and the
      # Linux sandbox drops the glob Read rules above, while `denyRead` globs
      # are enforced there (code.claude.com/docs/en/sandboxing; U17). The /tmp
      # pair covers checkouts outside $HOME (the audit worktrees, Claude's own
      # /tmp/claude-<uid>); Linux honours a wildcard after the first directory
      # name, so `/tmp/**` works where `/**` would cover nothing (U68).
      deny_read:
        - ~/**/.env
        - ~/**/.env.*
        - /tmp/**/.env
        - /tmp/**/.env.*
      # macOS /tmp is a link to /private/tmp; the Seatbelt rule names the real path.
      darwin_deny_read:
        - /private/tmp/**/.env
        - /private/tmp/**/.env.*
    # Rendered as sandbox.credentials. A `deny` file entry denies reads inside
    # the sandbox like denyRead; a `deny` envVars entry unsets the variable for
    # sandboxed commands. Every entry is a deny: a `mask` lets the sandbox proxy
    # put the real value into any request body to its injectHosts, so a
    # sandboxed client can send the placeholder to an endpoint that echoes it
    # (GitHub's POST /markdown) and read the real token back (audit round 6,
    # reproduced on the installed 2.1.310 transformer). The gh hosts file, the
    # file-based agent login stores and the chezmoi age key are denied (U68).
    # Each path appears once: Claude Code keeps the later of two entries.
    # Known limit, macOS: these entries cover files only. Claude Code's own
    # login and the gh token live in the login Keychain there, and the Claude
    # Code 2.1.310 Seatbelt profile always allows mach-lookup of
    # com.apple.SecurityServer and com.apple.securityd.xpc, with no setting to
    # remove them (allowMachLookup only adds services), so a sandboxed command
    # can ask securityd for those items (`security find-generic-password`).
    # On Linux the Claude login is the denied ~/.claude/.credentials.json.
    # The ~/.ssh and gh hosts denies mean a sandboxed `git push` or `gh` cannot
    # authenticate, so both are excluded commands behind their ask rules. All
    # sandbox denies hold for sandboxed runs only; the prompt is the gate for
    # the excluded commands (D-024-148).
    credentials:
      files:
        - path: ~/.ssh
          mode: deny
        - path: ~/.config/gh/hosts.yml
          mode: deny
        - path: ~/.claude/.credentials.json
          mode: deny
        - path: ~/.config/claude-code/oauth-token
          mode: deny
        - path: ~/.codex/auth.json
          mode: deny
        # The omp login stores, with their SQLite -wal and -shm companions.
        - path: ~/.omp/agent/agent.db*
          mode: deny
        - path: ~/.omp/profiles/*/agent/agent.db*
          mode: deny
        - path: ~/.config/age/key.txt
          mode: deny
      # The remote seat host's `claude setup-token` login, which ~/.zshenv
      # exports to every zsh (docs/remote-host-logins.md).
      envVars:
        - name: CLAUDE_CODE_OAUTH_TOKEN
          mode: deny
    network:
      allowedDomains:
        - github.com
        - api.github.com
        - uploads.github.com
        - objects.githubusercontent.com
        # GitHub release downloads (uv, mise, gh) redirect here.
        - release-assets.githubusercontent.com
        - codeload.github.com
        - pypi.org
        - files.pythonhosted.org
      # macOS certificate validation; the generator omits Mach services on Linux.
      allowMachLookup:
        - com.apple.trustd.agent
      # No allowUnixSockets: a socket a sandboxed command may reach is a way
      # out of the sandbox (the herdr socket starts host processes), so herdr
      # calls fail inside the macOS sandbox and are not retried (U68). On Linux
      # Claude Code ignores that list, and Unix sockets are blocked only when the
      # optional seccomp filter is installed (README "Claude Code sandbox").
      # The allow-all Unix socket switch is deliberately not set: with a
      # docker-group user or a reachable `systemd --user` bus it turns the
      # auto-approved sandbox into an escape (T44 r2, operator 2026-10-01).
  hooks:
    enforce_uv_hook: ~/.claude/hooks/enforce-uv.sh
    format_edited_files_hook: ~/.claude/hooks/format-edited-files.py
    project_map_reload_hook: ~/.claude/hooks/project-map-reload.sh
    permission_request:
      command: ~/.local/bin/common/permgate claude
      timeout: 10
      status_message: Evaluating permission request
    session_start:
      - matcher: "^(startup|resume|clear|compact|fork)$"
        hooks:
          - type: command
            # Must stay byte-identical to herdr's own SessionStart entry after
            # template expansion; herdr integration install no-ops on exact match
            # and would otherwise append a duplicate on every `make update`.
            command: "bash '{{ .chezmoi.homeDir }}/.claude/hooks/herdr-agent-state.sh' session"
            timeout: 10
      - matcher: "*"
        hooks:
          # Synchronous so the restart notice's systemMessage is shown to the user (an async
          # hook's output reaches only Claude). The scan stops at its own 2 s wall limit and
          # exits 0 silently, so it returns before this timeout; a timeout is non-blocking.
          - type: command
            command: "{{ .chezmoi.homeDir }}/.local/bin/common/agent-session-staleness hook"
            timeout: 3
  statusLine:
    type: command
    command: ccstatusline

plugins:
