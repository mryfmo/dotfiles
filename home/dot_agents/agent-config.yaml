      pin: v2026.10.3
      sha256:
        macos-x64: 791b92b446729c53e6501acd2b84ea207f541659ca9d0480c9c70c291919a321
        macos-arm64: 28ecc8640b0a28dab52817766f37fecfd898f1dff82e03f36fcb072e971f9246
