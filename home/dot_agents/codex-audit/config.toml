# Generated from home/dot_agents/agent-config.yaml by scripts/generate-agent-configs.py. Change codex.audit there.
# scripts/orchestrator/pr-audit.sh writes this file into each audit run's scratch CODEX_HOME, with every deny
# key resolved to absolute paths; the run refuses unless `audit` is the default permission profile.

default_permissions = "audit"
model = "gpt-6.1-sol"
model_reasoning_effort = "xhigh"
web_search = "disabled"

[skills]
include_instructions = false

[skills.bundled]
enabled = false

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false

[permissions.audit]
description = "Read-only audit: no network, credential stores denied to commands."
extends = ":read-only"

[permissions.audit.filesystem]
":root" = "read"
"$CODEX_LOGIN_HOME" = "deny"
"$CODEX_HOME" = "deny"
"~/.codex" = "deny"
"~/.ssh" = "deny"
"~/.gnupg" = "deny"
"~/.config/gh" = "deny"
"~/.local/share/gh" = "deny"
"~/.claude" = "deny"
"~/.claude.json" = "deny"
"~/.omp" = "deny"
"~/.config/chezmoi-private" = "deny"
"~/.local/share/chezmoi-private" = "deny"
"~/.aws" = "deny"
"~/.netrc" = "deny"
"~/.docker" = "deny"
"~/Library/Keychains" = "deny"
"~/.local/state/hcom-regime" = "deny"
"~/.local/state/hcom" = "deny"

[permissions.audit.network]
enabled = false
