# omp seat policy for the audit seat; the seat launcher passes it as
# `--config ~/.agents/omp/policies/audit.yml`. Schema: `tools.approvalMode`
# (src/tools/settings.ts:311-318), `tools.approval` (src/tools/settings.ts:295-305)
# and `bash.patterns` (src/exec/settings.ts:134-145) of @oh-my-pi/pi-coding-agent
# 18.11.3. Rules are ordered and the first match wins; a `deny` matches the whole
# command or any one segment, an `allow` must match the whole command and never a
# compound line (src/tools/bash.ts:301-307). Approval is not containment: the seat's
# operating-system account stays the filesystem and network boundary.
tools:
  # Read-tier tools run; a write or exec tool without a rule below prompts, and a
  # headless seat fails a prompt instead of allowing the call (docs/approval-mode.md).
  approvalMode: always-ask
  approval:
    edit: deny
    write: deny
    ast_edit: deny
    eval: deny
    task: deny
    manage_skill: deny
bash:
  patterns:
    - match: "*sudo *"
      approval: deny
    - match: "*rm -rf *"
      approval: deny
    - match: "*curl *|*sh"
      approval: deny
    - match: "*curl *|*sh *"
      approval: deny
    - match: "*wget *|*sh"
      approval: deny
    - match: "*wget *|*sh *"
      approval: deny
    - match: "*gh release*"
      approval: deny
    - match: "*npm publish*"
      approval: deny
    - match: "*uv publish*"
      approval: deny
    - match: "*terraform apply*"
      approval: deny
    - match: "*kubectl apply*"
      approval: deny
    - match: "*gh pr merge*"
      approval: deny
    - match: "*gh pr edit*"
      approval: deny
    - match: "*gh pr close*"
      approval: deny
    - match: "*gh pr review*"
      approval: deny
    - match: "*gh pr update-branch*"
      approval: deny
    - match: "*gh issue*"
      approval: deny
    - match: "*gh api* -X POST*"
      approval: deny
    - match: "*gh api* --method POST*"
      approval: deny
    - match: "*gh api* -XPOST*"
      approval: deny
    - match: "*gh api* --method=POST*"
      approval: deny
    - match: "*gh api* -X PATCH*"
      approval: deny
    - match: "*gh api* --method PATCH*"
      approval: deny
    - match: "*gh api* -XPATCH*"
      approval: deny
    - match: "*gh api* --method=PATCH*"
      approval: deny
    - match: "*gh api* -X PUT*"
      approval: deny
    - match: "*gh api* --method PUT*"
      approval: deny
    - match: "*gh api* -XPUT*"
      approval: deny
    - match: "*gh api* --method=PUT*"
      approval: deny
    - match: "*gh api* -X DELETE*"
      approval: deny
    - match: "*gh api* --method DELETE*"
      approval: deny
    - match: "*gh api* -XDELETE*"
      approval: deny
    - match: "*gh api* --method=DELETE*"
      approval: deny
    - match: "*gh api* -f*"
      approval: deny
    - match: "*gh api* -F*"
      approval: deny
    - match: "*gh api* --field*"
      approval: deny
    - match: "*gh api* --raw-field*"
      approval: deny
    - match: "*gh api* --input*"
      approval: deny
    # The read-only git and gh commands an audit needs; an allow never rides a pipe or a redirect.
    - match: "git status"
      approval: allow
    - match: "git status *"
      approval: allow
    - match: "git diff"
      approval: allow
    - match: "git diff *"
      approval: allow
    - match: "git log*"
      approval: allow
    - match: "git show*"
      approval: allow
    - match: "git rev-parse *"
      approval: allow
    - match: "git ls-files*"
      approval: allow
    - match: "gh pr view *"
      approval: allow
    - match: "gh pr diff *"
      approval: allow
    - match: "gh pr checks *"
      approval: allow
    - match: "gh run view *"
      approval: allow
    - match: "gh api repos/*"
      approval: allow
    # The one bus reply (hcom-audit SKILL): the thread route. hcom's own system prompt makes the
    # seat put `--name <its name>` on every hcom command, so that flag passes; `--from` and `-b`
    # are the external-sender spellings and are refused first. hcom authenticates neither flag
    # (D-024-135, README "Threat table"), so the policy guards the route, not the identity.
    # Quotes do not break the allow, but a `$` or a backtick inside double quotes does
    # (src/tools/bash.ts:94-136), so the seat pastes the sha and never writes `$(...)` in the line.
    - match: "*hcom send *--from*"
      approval: deny
    - match: "*hcom send * -b *"
      approval: deny
    - match: "hcom send --thread * -- *"
      approval: allow
    # Everything else is denied.
    - match: "*"
      approval: deny
