    # <<< command_policy <<<
    # U6d (D-024-136): `hcom send` is denied in every form, hcom's own `--name <its name>` prompt form
    # included; the audit writes its verdict to stdout and has no bus reply (U58).
    - match: "*hcom send*"
      approval: deny
    # The read-only git and gh commands an audit needs; an allow never rides a pipe or a redirect.
    - match: "git status"
      approval: allow
    - match: "git status *"
      approval: allow
    - match: "git diff"
      approval: allow
    - match: "git diff *"
      approval: allow
    - match: "git log*"
      approval: allow
    - match: "git show*"
      approval: allow
    - match: "git rev-parse *"
      approval: allow
    - match: "git ls-files*"
      approval: allow
    - match: "gh pr view *"
      approval: allow
    - match: "gh pr diff *"
      approval: allow
    - match: "gh pr checks *"
      approval: allow
    - match: "gh run view *"
      approval: allow
    - match: "gh api repos/*"
      approval: allow
    # Everything else is denied.
    - match: "*"
      approval: deny
