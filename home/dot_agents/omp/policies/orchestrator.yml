# omp seat policy for the orchestrator seat; the seat launcher passes it as
# `--config ~/.agents/omp/policies/orchestrator.yml`. Schema: `tools.approvalMode`
# (src/tools/settings.ts:311-318), `tools.approval` (src/tools/settings.ts:295-305)
# and `bash.patterns` (src/exec/settings.ts:134-145) of @oh-my-pi/pi-coding-agent
# 18.11.3. Rules are ordered and the first match wins; a `deny` matches the whole
# command or any one segment, an `allow` must match the whole command and never a
# compound line (src/tools/bash.ts:301-307). Approval is not containment: the seat's
# operating-system account stays the filesystem and network boundary.
tools:
  approvalMode: yolo
  approval:
    # bash.patterns do not reach a shell started through eval.
    eval: deny
    # No omp subagents (U34, U36): on 2026-10-24 at about 06:03Z the orchestrator seat spawned a Task subagent
    # on the claude-bridge route, the subagent failed with `No API key for provider: claude-bridge`, and from
    # then on every hcom delivery into the seat failed (`Extension sendUserMessage failed`), so the seat was
    # dead to the loop. A seat does its reading with its own tools.
    task: deny
bash:
  patterns:
    # The seat's GitHub-write levers (U28, scripts/orchestrator/README.md "Seat levers for GitHub writes"): each runs
    # alone, as one simple command, by the read-only copy chezmoi installs, and checks its own arguments before any
    # `gh` call. The deny after each allow catches every other spelling of that lever with arguments (the checkout
    # path, an expanded HOME, a missing `--from-table`) and the lever chained to anything, before the gh denies below.
    # No `gh pr merge` line is allowed (U71, F010; the common deny below): the seat's merge path is pr-merge.sh, which
    # refuses a head without a `correct` ledger row for its full sha or without green CI and never passes --admin or
    # --auto; pr-audit.sh runs one audit round and appends its ledger row. These rows match command text, so they are
    # a speed bump, not a boundary: a glob spelling (`pr-merge.s[h]`, `g[h] pr merge`) or a checkout copy passes them.
    # The merge decision rests on the lever's ledger check and on the store sitting in the orchestrator's checkout,
    # which no worker sandbox can write (U85); a seat that runs `gh` itself acts with the operator's GitHub
    # credentials, the residual U88 (a seat GitHub identity that cannot merge) removes.
    - match: "~/.local/bin/common/pr-merge.sh *"
      approval: allow
    - match: "*pr-merge.sh *"
      approval: deny
    - match: "~/.local/bin/common/pr-audit.sh *"
      approval: allow
    - match: "*pr-audit.sh *"
      approval: deny
    - match: "~/.local/bin/common/pr-thread-reply.sh *"
      approval: allow
    - match: "*pr-thread-reply.sh *"
      approval: deny
    - match: "~/.local/bin/common/pr-thread-resolve.sh *"
      approval: allow
    - match: "*pr-thread-resolve.sh *"
      approval: deny
    - match: "~/.local/bin/common/pr-update-branch.sh *"
      approval: allow
    - match: "*pr-update-branch.sh *"
      approval: deny
    - match: "~/.local/bin/common/pr-close.sh --from-table *"
      approval: allow
    - match: "*pr-close.sh *"
      approval: deny
    - match: "~/.local/bin/common/pr-threads-check.sh *"
      approval: allow
    - match: "*pr-threads-check.sh *"
      approval: deny
    # records-sync.sh acts with no arguments too (U28b F3): the exact bare form is allowed, every other bare
    # spelling and the bare form chained are denied as the argument forms are.
    - match: "~/.local/bin/common/records-sync.sh *"
      approval: allow
    - match: "~/.local/bin/common/records-sync.sh"
      approval: allow
    - match: "*records-sync.sh *"
      approval: deny
    - match: "*records-sync.sh"
      approval: deny
    # The worker's lever: the orchestrator edits no pull-request body.
    - match: "*pr-body-edit.sh *"
      approval: deny
    - match: "*sudo *"
      approval: deny
    - match: "*rm -rf *"
      approval: deny
    - match: "*curl *|*sh"
      approval: deny
    - match: "*curl *|*sh *"
      approval: deny
    - match: "*wget *|*sh"
      approval: deny
    - match: "*wget *|*sh *"
      approval: deny
    - match: "*gh release*"
      approval: deny
    - match: "*npm publish*"
      approval: deny
    - match: "*uv publish*"
      approval: deny
    - match: "*terraform apply*"
      approval: deny
    - match: "*kubectl apply*"
      approval: deny
    - match: "*gh pr merge*"
      approval: deny
    - match: "*gh pr edit*"
      approval: deny
    - match: "*gh pr close*"
      approval: deny
    - match: "*gh pr review*"
      approval: deny
    - match: "*gh pr update-branch*"
      approval: deny
    - match: "*gh issue*"
      approval: deny
    - match: "*gh api* -X POST*"
      approval: deny
    - match: "*gh api* --method POST*"
      approval: deny
    - match: "*gh api* -XPOST*"
      approval: deny
    - match: "*gh api* --method=POST*"
      approval: deny
    - match: "*gh api* -X PATCH*"
      approval: deny
    - match: "*gh api* --method PATCH*"
      approval: deny
    - match: "*gh api* -XPATCH*"
      approval: deny
    - match: "*gh api* --method=PATCH*"
      approval: deny
    - match: "*gh api* -X PUT*"
      approval: deny
    - match: "*gh api* --method PUT*"
      approval: deny
    - match: "*gh api* -XPUT*"
      approval: deny
    - match: "*gh api* --method=PUT*"
      approval: deny
    - match: "*gh api* -X DELETE*"
      approval: deny
    - match: "*gh api* --method DELETE*"
      approval: deny
    - match: "*gh api* -XDELETE*"
      approval: deny
    - match: "*gh api* --method=DELETE*"
      approval: deny
    - match: "*gh api* -f*"
      approval: deny
    - match: "*gh api* -F*"
      approval: deny
    - match: "*gh api* --field*"
      approval: deny
    - match: "*gh api* --raw-field*"
      approval: deny
    - match: "*gh api* --input*"
      approval: deny
    # Every other write goes through a repository script; the seat never pushes or opens PRs itself.
    - match: "*gh pr create*"
      approval: deny
    - match: "*gh pr ready*"
      approval: deny
    - match: "*gh pr comment*"
      approval: deny
    - match: "*git * push*"
      approval: deny
    - match: "*git push*"
      approval: deny
