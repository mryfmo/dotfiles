# omp seat policy for the worker seat; the seat launcher passes it as
# `--config ~/.agents/omp/policies/worker.yml`. Schema: `tools.approvalMode`
# (src/tools/settings.ts:311-318), `tools.approval` (src/tools/settings.ts:295-305)
# and `bash.patterns` (src/exec/settings.ts:134-145) of @oh-my-pi/pi-coding-agent
# 18.11.3. Rules are ordered and the first match wins; a `deny` matches the whole
# command or any one segment, an `allow` must match the whole command and never a
# compound line (src/tools/bash.ts:301-307). Approval is not containment: the seat's
# operating-system account stays the filesystem and network boundary.
tools:
  approvalMode: yolo
  approval:
    # bash.patterns do not reach a shell started through eval.
    eval: deny
    # No omp subagents (U34, U36): on 2026-10-24 at about 06:03Z the orchestrator seat spawned a Task subagent
    # on the claude-bridge route, the subagent failed with `No API key for provider: claude-bridge`, and from
    # then on every hcom delivery into the seat failed (`Extension sendUserMessage failed`), so the seat was
    # dead to the loop. A seat does its reading with its own tools.
    task: deny
    # A DAP launch starts any program outside bash.patterns, and the bridge's AskClaude runs a Claude Code child
    # with its own tools outside this overlay (U66, findings F040 and F006).
    debug: deny
    AskClaude: deny
bash:
  patterns:
    # The worker's one GitHub-write lever (U28, scripts/orchestrator/README.md "Seat levers for GitHub writes"): the
    # body of its own branch's pull request, by the sha256-pinned copy chezmoi installs, as one simple command; the deny
    # after it catches every other spelling with arguments and the lever chained to anything.
    - match: "~/.local/bin/common/pr-body-edit.sh --body-file *"
      approval: allow
    - match: "*pr-body-edit.sh *"
      approval: deny
    # The orchestrator's levers. Only the name followed by a space is denied, so a worker still edits, tests and lints
    # them as long as such a command names the file last (or names its directory). Text rows are a speed bump: a glob
    # spelling passes them (U71); a worker cannot forge the orchestrator's ledger, which lies outside its sandbox (U85),
    # and a worker that runs `gh` itself is the residual U88 removes.
    - match: "*pr-thread-reply.sh *"
      approval: deny
    - match: "*pr-thread-resolve.sh *"
      approval: deny
    - match: "*pr-update-branch.sh *"
      approval: deny
    - match: "*pr-close.sh *"
      approval: deny
    - match: "*pr-merge.sh *"
      approval: deny
    - match: "*records-sync.sh *"
      approval: deny
    # records-sync.sh acts with no arguments too (U28b F3), so its bare name is denied as well; a worker that edits
    # it names its directory (`git add scripts/orchestrator`, `shellcheck scripts/orchestrator/*`), never the file.
    - match: "*records-sync.sh"
      approval: deny
    # The command_policy denies of every seat and the plain launch (home/dot_agents/agent-config.yaml).
