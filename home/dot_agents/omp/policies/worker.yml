# omp seat policy for the worker seat; the seat launcher passes it as
# `--config ~/.agents/omp/policies/worker.yml`. Schema: `tools.approvalMode`
# (src/tools/settings.ts:311-318), `tools.approval` (src/tools/settings.ts:295-305)
# and `bash.patterns` (src/exec/settings.ts:134-145) of @oh-my-pi/pi-coding-agent
# 18.11.3. Rules are ordered and the first match wins; a `deny` matches the whole
# command or any one segment, an `allow` must match the whole command and never a
# compound line (src/tools/bash.ts:301-307). Approval is not containment: the seat's
# operating-system account stays the filesystem and network boundary.
tools:
  approvalMode: yolo
  approval:
    # bash.patterns do not reach a shell started through eval.
    eval: deny
    # No omp subagents (U34, U36): on 2026-10-24 at about 06:03Z the orchestrator seat spawned a Task subagent
    # on the claude-bridge route, the subagent failed with `No API key for provider: claude-bridge`, and from
    # then on every hcom delivery into the seat failed (`Extension sendUserMessage failed`), so the seat was
    # dead to the loop. A seat does its reading with its own tools.
    task: deny
bash:
  patterns:
    # The worker's one GitHub-write lever (U28, scripts/orchestrator/README.md "Seat levers for GitHub writes"): the
    # body of its own branch's pull request, by the read-only copy chezmoi installs, as one simple command; the deny
    # after it catches every other spelling with arguments and the lever chained to anything.
    - match: "~/.local/bin/common/pr-body-edit.sh --body-file *"
      approval: allow
    - match: "*pr-body-edit.sh *"
      approval: deny
    # The orchestrator's levers. Only the name followed by a space is denied, so a worker still edits, tests and lints
    # them as long as such a command names the file last (or names its directory).
    - match: "*pr-thread-reply.sh *"
      approval: deny
    - match: "*pr-thread-resolve.sh *"
      approval: deny
    - match: "*pr-update-branch.sh *"
      approval: deny
    - match: "*pr-close.sh *"
      approval: deny
    - match: "*pr-merge.sh *"
      approval: deny
    - match: "*pr-audit.sh *"
      approval: deny
    - match: "*records-sync.sh *"
      approval: deny
    # records-sync.sh acts with no arguments too (U28b F3), so its bare name is denied as well; a worker that edits
    # it names its directory (`git add scripts/orchestrator`, `shellcheck scripts/orchestrator/*`), never the file.
    - match: "*records-sync.sh"
      approval: deny
    - match: "*sudo *"
      approval: deny
    - match: "*rm -rf *"
      approval: deny
    - match: "*curl *|*sh"
      approval: deny
    - match: "*curl *|*sh *"
      approval: deny
    - match: "*wget *|*sh"
      approval: deny
    - match: "*wget *|*sh *"
      approval: deny
    - match: "*gh release*"
      approval: deny
    - match: "*npm publish*"
      approval: deny
    - match: "*uv publish*"
      approval: deny
    - match: "*terraform apply*"
      approval: deny
    - match: "*kubectl apply*"
      approval: deny
    - match: "*gh pr merge*"
      approval: deny
    - match: "*gh pr edit*"
      approval: deny
    - match: "*gh pr close*"
      approval: deny
    - match: "*gh pr review*"
      approval: deny
    - match: "*gh pr update-branch*"
      approval: deny
    - match: "*gh issue*"
      approval: deny
    - match: "*gh api* -X POST*"
      approval: deny
    - match: "*gh api* --method POST*"
      approval: deny
    - match: "*gh api* -XPOST*"
      approval: deny
    - match: "*gh api* --method=POST*"
      approval: deny
    - match: "*gh api* -X PATCH*"
      approval: deny
    - match: "*gh api* --method PATCH*"
      approval: deny
    - match: "*gh api* -XPATCH*"
      approval: deny
    - match: "*gh api* --method=PATCH*"
      approval: deny
    - match: "*gh api* -X PUT*"
      approval: deny
    - match: "*gh api* --method PUT*"
      approval: deny
    - match: "*gh api* -XPUT*"
      approval: deny
    - match: "*gh api* --method=PUT*"
      approval: deny
    - match: "*gh api* -X DELETE*"
      approval: deny
    - match: "*gh api* --method DELETE*"
      approval: deny
    - match: "*gh api* -XDELETE*"
      approval: deny
    - match: "*gh api* --method=DELETE*"
      approval: deny
    - match: "*gh api* -f*"
      approval: deny
    - match: "*gh api* -F*"
      approval: deny
    - match: "*gh api* --field*"
      approval: deny
    - match: "*gh api* --raw-field*"
      approval: deny
    - match: "*gh api* --input*"
      approval: deny
    # main is PR-only: no push whose target branch is main, in the bare or the `git -c` spelling.
    # shortcut: a push to `+main` or `refs/heads/main` passes here and stops at the GitHub ruleset; add the spelling when a seat uses it.
    - match: "*git *push* main"
      approval: deny
    - match: "*git *push* main *"
      approval: deny
    - match: "*git *push*:main"
      approval: deny
    - match: "*git *push*:main *"
      approval: deny
