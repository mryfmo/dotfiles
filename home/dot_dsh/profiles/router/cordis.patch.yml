# Generated from home/dot_agents/agent-config.yaml by scripts/generate-agent-configs.py.
# dsh-superagent pin 8c32a9dc5d72c033816c6a8110b37f40cf94fba4; the Router runs under srt through `hcom-seat router -- --no-open`.
# GitHub Source (assets.dsh-superagent.sources.github): repository mryfmo/dotfiles, accept_mode
# observe (M-18 ladder row 2026-11-06T23:24:00Z); the allowed list is empty.
# These two values live in the Router's settings store (upstream docs/006-deployment.md, Settings), where the
# lever `router-settings-apply` writes them through the Management API after the launch's ready line, with the
# Source's `cli` set to `router-gh`, the gh wrapper whose GH_CONFIG_DIR is $DSH_HOME/router-credentials/gh (the
# router role's one read grant beyond the dsh row's; U353). The plugin row below admits stateDir and limits alone.
- id: session-log-deepseek
  config:
    enabled: false
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-deepseek-api
  disabled: true
- id: agent-default-model
  config:
    provider: claude-bridge
    model: claude-opus-5-5
- id: webserver
  config:
    host: 127.0.0.1
    port: 3082
- id: dsh-superagent
  config:
    stateDir: !!js process.env.DSH_HOME + '/router-state'
- id: tool-subagent
  disabled: false
  config:
    provider: acp
    toolName: subagent
    maxDepth: provider-managed
- id: dsh-superagent-worker-preset
  config:
    id: dsh-superagent-worker
    name: dsh-superagent 执行器
    description: dsh-superagent 的执行器 Session 专用，不供手动选择。前台命令超 5 秒转入后台，只含执行工作所需的工具。
    order: 90
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: You are a coding agent powered by the {{model}} model.
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - id: time-context
        name: '@deepseek-ai/dsh-time-context'
      - id: shell
        name: cordis:group
        group: true
        isolate:
          shell: true
        config:
          - id: bash-sandbox
            name: '@deepseek-ai/dsh-bash-sandbox'
            disabled: !!js process.platform === 'win32'
            config:
              timeoutMs: 5000
              maxTimeoutMs: 5000
          - id: pwsh-sandbox
            name: '@deepseek-ai/dsh-pwsh-sandbox'
            disabled: !!js process.platform !== 'win32'
            config:
              timeoutMs: 5000
              maxTimeoutMs: 5000
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
        config:
          waitTimeoutMs: 5000
          maxWaitTimeoutMs: 5000
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
      - id: delegation
        name: cordis:group
        group: true
        isolate:
          workflowEngine: true
        config:
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: acp
              toolName: subagent
              maxDepth: provider-managed
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: false
          searchTimeoutMs: 60000
- insert:
    - id: omp-gateway
      name: dsh-omp-gateway
      config:
        command: omp
        args:
          - auth-gateway
          - stdio
        providers:
          - claude-bridge
        models:
          - claude-bridge/claude-haiku-5-5
          - claude-bridge/claude-opus-5-5
    - id: subagent-acp
      name: '@deepseek-ai/dsh-subagent-acp'
      config:
        providerName: acp
        command: !!js process.env.HOME + '/.local/bin/common/acp-seat'
        args:
          - --socket
          - !!js process.env.ACP_BROKER_SOCK
          - --name
          - router
        permission: allow
        env: {}
