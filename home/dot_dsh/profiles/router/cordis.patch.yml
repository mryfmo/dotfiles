# Generated from home/dot_agents/agent-config.yaml by scripts/generate-agent-configs.py.
# dsh-superagent pin 8c32a9dc5d72c033816c6a8110b37f40cf94fba4; the Router runs under srt through `hcom-seat router -- --no-open`.
# GitHub Source (assets.dsh-superagent.sources.github): repository mryfmo/dotfiles, accept_mode
# observe (M-18 ladder row 2026-11-06T23:24:00Z); the allowed list is empty.
# These two values live in the Router's settings store (upstream docs/006-deployment.md, Settings), where the
# lever `router-settings-apply` writes them through the Management API after the launch's ready line, with the
# Source's `cli` set to `router-gh`, the gh wrapper whose GH_CONFIG_DIR is $DSH_HOME/router-credentials/gh (the
# router role's one read grant beyond the dsh row's; U353). The plugin row below admits stateDir and limits alone.
- id: session-log-deepseek
  config:
    enabled: false
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-deepseek-api
  disabled: true
- id: agent-default-model
  config:
    provider: claude-bridge
    model: claude-opus-5-5
- id: webserver
  config:
    host: 127.0.0.1
    port: 3082
- id: dsh-superagent
  config:
    stateDir: !!js process.env.DSH_HOME + '/router-state'
- id: tool-subagent
  config:
    provider: acp
    toolName: subagent
    maxDepth: provider-managed
- insert:
    - id: omp-gateway
      name: dsh-omp-gateway
      config:
        command: omp
        args:
          - auth-gateway
          - stdio
        providers:
          - claude-bridge
        models:
          - claude-bridge/claude-haiku-5-5
          - claude-bridge/claude-opus-5-5
    - id: subagent-acp
      name: '@deepseek-ai/dsh-subagent-acp'
      config:
        providerName: acp
        command: !!js process.env.HOME + '/.local/bin/common/acp-seat'
        args:
          - --socket
          - !!js process.env.ACP_BROKER_SOCK
          - --name
          - router
        permission: allow
        env: {}
