[tools]
# Tools track "latest" behind minimum_release_age; make update upgrades them. A held tool keeps an exact version and says why.
node = "latest"
rust = "latest"
python = "latest"

age = "latest"
bun = "latest"
chezmoi = "latest"
dotenvx = "latest"
"cargo:eza" = "latest"
fd = "latest"
jq = "latest"
hugo-extended = "latest"
uv = "latest"
yazi = "latest"
"aqua:micro-editor/micro" = "latest"
"aqua:mikefarah/yq" = "latest"
"aqua:watchexec/watchexec" = "latest"

"npm:@anthropic-ai/claude-code" = { version = "latest", allow_builds = ["@anthropic-ai/claude-code"] }
"npm:@openai/codex" = "latest"
# sandbox-runtime: the `srt` that contains the omp seats (scripts/orchestrator/hcom-seat, regime-cutover U85).
"npm:@anthropic-ai/sandbox-runtime" = "latest"
"npm:bash-language-server" = "latest"
# Held with ccusage: the CI statusline smoke runs both; keep until ccusage restores linux-x64 (U42).
"npm:ccstatusline" = "2.2.32"
# Held: the npm backend installs 20.0.38 without its optional linux-x64 native binary (run 40087404553); keep until a release restores it.
"npm:ccusage" = "20.0.37"
"npm:pyright" = "latest"
"npm:fast-cli" = "latest"
# Held: a lint gate; make format and CI's formatting check run exactly this prettier (U97).
"npm:prettier" = "3.9.10"
# Builds the Understand-Anything plugin core (update-agent-assets.sh). Held: the
# plugin lockfile is lockfileVersion 9.0 and declares no packageManager.
"npm:pnpm" = "12.8.1"

"github:x-motemen/ghq" = "latest"
"github:d-kuro/gwq" = "latest"
"github:cli/cli" = "latest"
"github:ogulcancelik/herdr" = "latest"

"cargo:pueue" = "latest"

# http backend: bumped by hand with its checksum.
[tools."http:bats"]
version = "1.14.0"
url = "https://github.com/bats-core/bats-core/archive/refs/tags/v1.14.0.tar.gz"
checksum = "sha256:bb537b70b15b732f6d8827dd6578e3d8ce166636ce1f18ea9a074184fcce9177"
strip_components = 1
bin_path = "bin"

# http backend: bumped by hand with its checksum.
[tools."http:gcloud"]
version = "590.0.0"
bin_path = "google-cloud-sdk/bin"

# Provenance: SHA-256 of each versioned tarball as downloaded from storage.googleapis.com/cloud-sdk-release;
# the downloads-versioned-archives page publishes digests only for the current release, not for this one.
[tools."http:gcloud".platforms]
linux-x64 = { url = "https://storage.googleapis.com/cloud-sdk-release/google-cloud-cli-590.0.0-linux-x86_64.tar.gz", checksum = "sha256:1503a6fcda689d1e1013a421e2c85850e7f58382c0be7064877b5e1a1038bc64" }
linux-arm64 = { url = "https://storage.googleapis.com/cloud-sdk-release/google-cloud-cli-590.0.0-linux-arm.tar.gz", checksum = "sha256:547c5c28ae449a862339edbe73e4254073b33072a364463f581adebf894c5cfa" }
macos-x64 = { url = "https://storage.googleapis.com/cloud-sdk-release/google-cloud-cli-590.0.0-darwin-x86_64.tar.gz", checksum = "sha256:3b1380b3118e9bb89dc108b6eb291e41468289415dcd2a33cdfc55e2570d3ede" }
macos-arm64 = { url = "https://storage.googleapis.com/cloud-sdk-release/google-cloud-cli-590.0.0-darwin-arm.tar.gz", checksum = "sha256:a3327108b808f3cc42aa57912bb1b175ccae16fe6cedb90fdd05cd84f8b89b49" }

# http backend: bumped by hand with its checksums. make shellcheck refuses any other ShellCheck and CI installs this one.
[tools."http:shellcheck"]
version = "0.11.0"
strip_components = 1

# Provenance: SHA-256 of each release asset as downloaded from github.com/koalaman/shellcheck, equal to the digest
# GitHub's release API reports for it (uploaded 2025-08-04).
[tools."http:shellcheck".platforms]
linux-x64 = { url = "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz", checksum = "sha256:8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198" }
linux-arm64 = { url = "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.aarch64.tar.xz", checksum = "sha256:12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588" }
macos-x64 = { url = "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.darwin.x86_64.tar.xz", checksum = "sha256:3c89db4edcab7cf1c27bff178882e0f6f27f7afdf54e859fa041fca10febe4c6" }
macos-arm64 = { url = "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.darwin.aarch64.tar.xz", checksum = "sha256:56affdd8de5527894dca6dc3d7e0a99a873b0f004d7aabc30ae407d3f48b0a79" }

# http backend: bumped by hand with its checksums. make format and make shellcheck refuse any other shfmt, CI installs this one.
[tools."http:shfmt"]
version = "3.14.1"
bin = "shfmt"

# Provenance: SHA-256 of each release binary as downloaded from github.com/mvdan/sh, equal to the digest GitHub's
# release API reports for it (the release publishes no checksum file).
[tools."http:shfmt".platforms]
linux-x64 = { url = "https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64", checksum = "sha256:76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf" }
linux-arm64 = { url = "https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_arm64", checksum = "sha256:5f2db09dae91fca848f7adbdd014632e921a383863a2ad7e0450ad3aba0c6489" }
macos-x64 = { url = "https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_darwin_amd64", checksum = "sha256:d33eee0da0f92835b3562e9767a05cee7e4eaeef47daa03bfd09da17b4b590a6" }
macos-arm64 = { url = "https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_darwin_arm64", checksum = "sha256:b7c872db63553ccffc7253aba3ed7d4885a27d83f1ba567b1138c6315a5847e5" }

# http backend: bumped by hand with its checksums. make format refuses any other ruff and CI's formatting check runs this one.
[tools."http:ruff"]
version = "0.17.2"
strip_components = 1

# Provenance: SHA-256 of each release archive as downloaded from github.com/astral-sh/ruff, equal to both the
# release's own `.sha256` file and the digest GitHub's release API reports for it.
[tools."http:ruff".platforms]
linux-x64 = { url = "https://github.com/astral-sh/ruff/releases/download/0.17.2/ruff-x86_64-unknown-linux-gnu.tar.gz", checksum = "sha256:7b2e6a6e132ecf7b5fe726163b186d5d209befe93bb25f83767b2d97fbdf14e5" }
linux-arm64 = { url = "https://github.com/astral-sh/ruff/releases/download/0.17.2/ruff-aarch64-unknown-linux-gnu.tar.gz", checksum = "sha256:468f29d64949574f0d28442c02f0b4fb680cff7ba8fc26b6287a73b945308e1c" }
macos-x64 = { url = "https://github.com/astral-sh/ruff/releases/download/0.17.2/ruff-x86_64-apple-darwin.tar.gz", checksum = "sha256:db57a84e385435a2c4a7c8946e588f79b9de0851d8618a1b5d4431edfff0bf01" }
macos-arm64 = { url = "https://github.com/astral-sh/ruff/releases/download/0.17.2/ruff-aarch64-apple-darwin.tar.gz", checksum = "sha256:94fbca85f19e8b6bb068adb7cbc9a74e3e6c01004cc67c6b00246a094ad4ccd9" }

[settings]
idiomatic_version_file_enable_tools = ["python"]
minimum_release_age = "72h"

[settings.self_update]
minimum_release_age = "72h"

[settings.npm]
package_manager = "npm"

[settings.cargo]
binstall = false
