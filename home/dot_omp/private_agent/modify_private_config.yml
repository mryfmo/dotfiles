#!/bin/sh
# @file home/dot_omp/private_agent/modify_private_config.yml
# @brief Carry the managed omp model role, skill roots, extensions and disabled providers into ~/.omp/agent/config.yml.
# @description
#   chezmoi passes the live config on stdin. The merge sets modelRoles.default,
#   skills.customDirectories, extensions and disabledProviders from
#   home/.chezmoitemplates/omp-config-managed.yml (a leading ~ expanded to
#   $HOME, see docs/omp-skills.md) and keeps every other
#   key and role omp wrote. It runs under `uv run --with pyyaml`, so the system
#   python3 needs no PyYAML. Without uv, or when the live file is not a YAML
#   mapping, it prints its input unchanged with one warning on stderr and
#   exits 0, so chezmoi apply never clobbers omp's file.
set -eu

if ! command -v uv > /dev/null 2>&1; then
  echo "omp config: uv is not installed; left ~/.omp/agent/config.yml unchanged" >&2
  exec cat
fi

merge=$(cat <<'PY'
import os
import sys
from pathlib import Path

import yaml


def keep(current, reason):
    print(f"omp config: {reason}; left ~/.omp/agent/config.yml unchanged", file=sys.stderr)
    sys.stdout.write(current)
    return 0


def main():
    current = sys.stdin.read()
    managed_path = Path(os.environ["CHEZMOI_SOURCE_DIR"]) / ".chezmoitemplates/omp-config-managed.yml"
    managed = yaml.safe_load(managed_path.read_text())
    try:
        data = yaml.safe_load(current) if current.strip() else {}
    except yaml.YAMLError:
        return keep(current, "the live file is not valid YAML")
    if not isinstance(data, dict):
        return keep(current, "the live file is not a YAML mapping")
    if data.get("modelRoles") is None:
        data["modelRoles"] = {}
    if not isinstance(data["modelRoles"], dict):
        return keep(current, "modelRoles is not a mapping")
    data["modelRoles"]["default"] = managed["modelRoles"]["default"]
    if data.get("skills") is None:
        data["skills"] = {}
    if not isinstance(data["skills"], dict):
        return keep(current, "skills is not a mapping")
    # `omp skill list` resolves a non-absolute entry against cwd before omp expands ~ (src/cli/skill-list.ts:58-64).
    data["skills"]["customDirectories"] = [os.path.expanduser(d) for d in managed["skills"]["customDirectories"]]
    # A plain launch registers the default model's extension provider only through this list (docs/pi-claude-bridge.md).
    data["extensions"] = [os.path.expanduser(d) for d in managed["extensions"]]
    # A disabled provider stays unselectable even with a stored OAuth session (omp docs/providers.md).
    data["disabledProviders"] = managed["disabledProviders"]
    sys.stdout.write(yaml.safe_dump(data, sort_keys=False))
    return 0


sys.exit(main())
PY
)

exec uv run --quiet --no-project --with pyyaml python -c "$merge"
