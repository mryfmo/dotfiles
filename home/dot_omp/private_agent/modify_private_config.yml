#!/bin/sh
# @file home/dot_omp/private_agent/modify_private_config.yml
# @brief Carry the managed omp model role, skill settings, extensions, disabled providers, update check and denies into ~/.omp/agent/config.yml.
# @description
#   chezmoi passes the live config on stdin. The merge sets modelRoles.default,
#   every managed skills key (customDirectories, ignoredSkills; skills.audience
#   in the manifest), extensions, disabledProviders and startup.checkUpdate
#   (omp.check_update; every other startup key stays) from
#   home/.chezmoitemplates/omp-config-managed.yml (a leading ~ expanded to
#   $HOME, see docs/omp-skills.md). When the managed file carries them (U66) it
#   also merges the managed tools.approval denies (a managed key wins, every
#   other key stays) and puts the managed bash.patterns denies first, ahead of
#   every pattern already in the file, which stays in its order: omp's first
#   matching rule wins, so a managed deny beats a user allow for the same
#   command. tools.approvalMode is never touched. It keeps every other
#   key and role omp wrote. It runs under `uv run --with pyyaml`, so the system
#   python3 needs no PyYAML. Without uv, or when the live file is not a YAML
#   mapping, it prints its input unchanged with one warning on stderr and
#   exits 0, so chezmoi apply never clobbers omp's file.
set -eu

if ! command -v uv > /dev/null 2>&1; then
  echo "omp config: uv is not installed; left ~/.omp/agent/config.yml unchanged" >&2
  exec cat
fi

merge=$(cat <<'PY'
import os
import sys
from pathlib import Path

import yaml


def keep(current, reason):
    print(f"omp config: {reason}; left ~/.omp/agent/config.yml unchanged", file=sys.stderr)
    sys.stdout.write(current)
    return 0


def main():
    current = sys.stdin.read()
    managed_path = Path(os.environ["CHEZMOI_SOURCE_DIR"]) / ".chezmoitemplates/omp-config-managed.yml"
    managed = yaml.safe_load(managed_path.read_text())
    try:
        data = yaml.safe_load(current) if current.strip() else {}
    except yaml.YAMLError:
        return keep(current, "the live file is not valid YAML")
    if not isinstance(data, dict):
        return keep(current, "the live file is not a YAML mapping")
    if data.get("modelRoles") is None:
        data["modelRoles"] = {}
    if not isinstance(data["modelRoles"], dict):
        return keep(current, "modelRoles is not a mapping")
    data["modelRoles"]["default"] = managed["modelRoles"]["default"]
    if data.get("skills") is None:
        data["skills"] = {}
    if not isinstance(data["skills"], dict):
        return keep(current, "skills is not a mapping")
    # skills.audience owns every key the managed file carries; other skills keys stay as omp or the operator set them.
    for key, value in managed["skills"].items():
        data["skills"][key] = value
    # `omp skill list` resolved a non-absolute entry against cwd before expanding ~ until omp 18.12.3
    # (src/cli/skill-list.ts:58-64 of 18.11.3); an absolute entry reads the same in every release.
    if "customDirectories" in managed["skills"]:
        data["skills"]["customDirectories"] = [os.path.expanduser(d) for d in managed["skills"]["customDirectories"]]
    # A plain launch registers the default model's extension provider only through this list (docs/pi-claude-bridge.md).
    data["extensions"] = [os.path.expanduser(d) for d in managed["extensions"]]
    # A disabled provider stays unselectable even with a stored OAuth session (omp docs/providers.md).
    data["disabledProviders"] = managed["disabledProviders"]
    # omp self-update refuses this install; the update path is the reviewed pin (omp.check_update, U94).
    if data.get("startup") is None:
        data["startup"] = {}
    if not isinstance(data["startup"], dict):
        return keep(current, "startup is not a mapping")
    data["startup"]["checkUpdate"] = managed["startup"]["checkUpdate"]
    # Outright denies only (U66): tools.approvalMode and every other tools.approval entry stay as omp or the operator set them.
    if "tools" in managed:
        if data.get("tools") is None:
            data["tools"] = {}
        if not isinstance(data["tools"], dict):
            return keep(current, "tools is not a mapping")
        if data["tools"].get("approval") is None:
            data["tools"]["approval"] = {}
        if not isinstance(data["tools"]["approval"], dict):
            return keep(current, "tools.approval is not a mapping")
        # A managed deny replaces the same key; every other entry, an operator's deny or allow, stays.
        data["tools"]["approval"].update(managed["tools"]["approval"])
    if "bash" in managed:
        if data.get("bash") is None:
            data["bash"] = {}
        if not isinstance(data["bash"], dict):
            return keep(current, "bash is not a mapping")
        existing = data["bash"].get("patterns")
        if existing is None:
            existing = []
        if not isinstance(existing, list):
            return keep(current, "bash.patterns is not a list")
        # omp takes the first matching rule (docs/settings.md, "Bash command approval patterns"), so the managed denies
        # go first and a user allow for the same command cannot pass them; every user rule stays, in its order, and
        # an exact copy of a managed rule is dropped, so a second apply changes nothing.
        rules = managed["bash"]["patterns"]
        data["bash"]["patterns"] = rules + [rule for rule in existing if rule not in rules]
    sys.stdout.write(yaml.safe_dump(data, sort_keys=False))
    return 0


sys.exit(main())
PY
)

exec uv run --quiet --no-project --with pyyaml python -c "$merge"
